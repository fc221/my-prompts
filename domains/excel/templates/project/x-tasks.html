<script type="module">
import { draw, sheet } from '../../../frontend/_shared/diagram.ts';
export default function demo(root) {

  row(2, 'warn'); row(3, 'bad'); row(4, 'done'); row(6, 'done');
  draw(root, sheet({
    head: ['编号', '任务', '负责人', '优先级', '状态', '截止日期', '完成日期', '剩余天数', '逾期'],
    widths: [52, 118, 50, 50, 64, 60, 60, 56, 40],
    rows: [
      ['T-0031', '提交 11 月排班表', '何静', '高 ▾', '进行中 ▾', '10-31', '', '1', ''],
      ['T-0032', '门店灯箱改稿', '韩若楠', '中 ▾', '待确认 ▾', '10-27', '', '-3', '逾期'],
      ['T-0033', '盘点燕麦奶库存', '唐一鸣', '中 ▾', '已完成 ▾', '10-28', '10-28', '', ''],
      ['T-0034', '续签禾木书店合同', '周启航', '高 ▾', '未开始 ▾', '11-10', '', '11', ''],
      ['T-0035', '年会场地询价', '苏沐阳', '低 ▾', '已取消 ▾', '11-20', '', '', ''],
    ],
    fx: ['H2', '=IF(OR([@状态]="已完成",[@状态]="已取消"),"",[@截止日期]-TODAY())'],
    marks,
    tabs: ['任务表', '统计', '归档', '参数'],
    freeze: true,
  }), { title: '任务清单 · 今天 10-30，逾期标红、3 天内到期标黄、完成划掉', min: 0.45 });
}
</script>
