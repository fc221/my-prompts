<link rel="stylesheet" href="../../../frontend/_shared/diagram.css">

<script type="module">
import { draw, boxes, code } from '../../../frontend/_shared/diagram.ts';
export default function demo(root) {
  const libs = boxes([
    { t: 'xlsxwriter · Python', items: ['只新建，不能读改', '图表、迷你图、条件格式', '动态数组公式'], acc: true },
    { t: 'openpyxl · Python', items: ['读、改、写', '新函数手写 _xlfn.', '另存会丢切片器、迷你图'] },
    { t: 'pandas · Python', items: ['DataFrame 一行写出', 'engine 选 xlsxwriter', '格式从 writer.sheets 补'] },
    { t: 'ExcelJS · Node', items: ['读写 + 样式 + 验证', '流式读写大文件', '不能画图表'] },
    { t: 'SheetJS · 浏览器', items: ['读的格式最多', '社区版不写样式', '用官方 0.20.x 包'] },
  ], { cols: 5 });
  const py = code([{ t: 'xlsxwriter：编码写文本、金额写数值、用户文本不当公式', text: `
wb = xlsxwriter.Workbook('销售明细_2026-10.xlsx',
                         {'strings_to_formulas': False, 'strings_to_urls': False})
ws = wb.add_worksheet('明细')
head = wb.add_format({'bold': True, 'bg_color': '#E8EEF7', 'border': 1})
money = wb.add_format({'num_format': '#,##0.00'})
day = wb.add_format({'num_format': 'yyyy-mm-dd'})
ws.write_row(0, 0, ['订单号', '下单日期', '门店', '备注', '金额'], head)
for r, o in enumerate(orders, start=1):
    ws.write_string(r, 0, o.no)              # 编码：文本，保住前导 0
    ws.write_datetime(r, 1, o.day, day)
    ws.write_string(r, 2, o.store)
    ws.write_string(r, 3, o.note)            # 用户填写的内容
    ws.write_number(r, 4, o.amount, money)
ws.write_formula(len(orders) + 1, 4, f'=SUM(E2:E{len(orders) + 1})', money)
ws.freeze_panes('A2')
ws.autofilter(0, 0, len(orders), 4)
ws.set_column('A:A', 16); ws.set_column('D:D', 28)
wb.close()
` }]);
  draw(root, libs + '<div style="height:10px"></div>' + py, { title: '代码生成 Excel · 先按“新建还是改文件”选库', min: 0.45 });
}
</script>
