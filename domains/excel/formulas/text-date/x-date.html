<script type="module">
import { draw, sheet } from '../../../frontend/_shared/diagram.ts';
export default function demo(root) {

  draw(root, [
    tag('应收台账 · 截止日期 参数!B1 = 2026-10-31') + sheet({

        ['青禾餐饮', '2026-10-12', '18,600.00', '19', '30 天内'],

      tabs: ['应收台账', '档位表', '参数'],
      freeze: true,

    tag('档位表') + sheet({
