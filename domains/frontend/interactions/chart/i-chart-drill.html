<link rel="stylesheet" href="../../_shared/interactions-base.css">
<style>
.st{padding:10px 12px}
.box{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:6px;max-width:600px;height:100%;margin:0 auto;padding:8px 12px;border:1px solid #e3e6eb;border-radius:12px;background:#fff}
.hd{display:flex;align-items:center;gap:8px;min-width:0;height:24px}
.bc{display:flex;align-items:center;flex:1;min-width:0;margin:0;padding:0;list-style:none;font-size:13px;white-space:nowrap;overflow:hidden}
.bc li{display:flex;align-items:center;min-width:0}
.bc li+li::before{content:"/";margin:0 4px;color:#aab0bb}
.bc button{height:24px;padding:0 4px;border:0;border-radius:6px;background:none;color:#3b5bdb}
.bc button:hover{background:#edf1ff}
.bc span{outline:0;display:inline-flex;align-items:center;gap:6px;padding:0 4px;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.bc .sp{width:12px;height:12px}
.u{flex:none;color:#5b616e;font-size:12px}
.rows{display:grid;grid-auto-rows:minmax(0,30px);align-content:start;gap:3px;min-height:0;margin:0;padding:0;list-style:none}
.rows li{display:flex;min-height:0}
.row{display:grid;grid-template-columns:minmax(0,5.8em) minmax(0,1fr) 3.2em;align-items:center;gap:8px;width:100%;min-height:0;padding:0 4px;border:0;border-radius:6px;background:none;font-size:12px;text-align:left}
button.row:hover{background:#f5f6f8}
button.row:hover .tr i{background:#2f4ac0}
.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.row .nm::after{content:" ›";color:#3b5bdb;font-weight:600}
.tr{height:62%;max-height:16px;min-height:6px}
.tr i{display:block;width:var(--w,0);height:100%;border-radius:0 4px 4px 0;background:#3b5bdb;transition:width .22s cubic-bezier(.2,.8,.2,1)}
.leaf .tr i{background:#7b93e6}
.ske .tr i{background:#eceef2;width:var(--w)}
.vl{color:#1f2329;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.ft{display:flex;align-items:center;gap:8px;min-width:0;height:22px}
.msg{flex:1;min-width:0;margin:0;color:#5b616e;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt{display:inline-flex;align-items:center;justify-content:center;flex:none;height:24px;min-width:28px;padding:0 10px;border:1px solid #d0d5dd;border-radius:7px;background:#fff;color:#1f2329;font-size:12px;font-weight:500;white-space:nowrap;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.bt:hover{background:#f5f6f8}
.bt:disabled{opacity:.45;cursor:default;background:#fff}
@container (max-width:320px){.u{display:none}
}
@container (min-width:560px){.box{padding:12px 16px}
.rows{grid-auto-rows:minmax(0,36px)}
.row{font-size:13px;grid-template-columns:minmax(0,8.5em) minmax(0,1fr) 3.5em}
}
</style>

<div class="st"><div class="box"><div class="hd"><nav aria-label="层级" style="flex:1;min-width:0"><ol class="bc"></ol></nav><span class="u">本月借阅量（本）</span></div><ul class="rows"></ul><div class="ft"><p class="msg" role="status"></p><button type="button" class="bt retry" hidden>重试</button></div></div></div>

<script type="module">
export default function demo(root) {
  const t = (n, v, c) => ({ n, v, c });
  const TREE = t('全部分类', 0, [
    t('文学', 1286, [t('小说', 642, [t('《雾港来信》', 188), t('《第七条街》', 151), t('《北纬三十度的雨》', 129), t('《慢车》', 98), t('《潮汐表》', 76)]), t('散文', 318), t('诗歌', 176), t('戏剧', 150)]),
    t('少儿', 964, [t('绘本', 412), t('科普读物', 305, [t('《星星为什么眨眼》', 121), t('《一滴水去旅行》', 98), t('《恐龙住在哪》', 86)]), t('童话', 247)]),
    t('科技', 712, [t('编程', 286), t('人工智能', 214), t('电子', 128), t('建筑', 84)]),
    t('历史', 538, [t('中国史', 268), t('世界史', 176), t('考古', 94)]),
    t('艺术', 305, [t('摄影', 128), t('设计', 102), t('音乐', 75)]),
  ]);
  const bc = root.querySelector('.bc'), rows = root.querySelector('.rows'), msg = root.querySelector('.msg'), retry = root.querySelector('.retry');
  let path = [{ node: TREE, from: -1 }], seq = 0, pending = -1, failOnce = true, stop = false, retryFn = null;
  // 模拟取数：360ms 后返回子级；“历史”第一次会失败
  const load = (node) => new Promise((ok, no) => setTimeout(() => { if (node.n === '历史' && failOnce) { failOnce = false; no(new Error('网络错误')); } else ok(node.c); }, 360));
  const crumbs = (pending) => {
    bc.innerHTML = '';
    const items = pending ? [...path, { node: pending }] : path;
    items.forEach((p, i) => {
      const li = document.createElement('li');
      if (i === items.length - 1) li.innerHTML = `<span aria-current="page" tabindex="-1">${p.node.n}${pending ? '<i class="sp" aria-hidden="true"></i>' : ''}</span>`;
      else { const b = document.createElement('button'); b.type = 'button'; b.textContent = p.node.n; b.onclick = () => up(i); li.append(b); }
      bc.append(li);
    });
  };
  const render = (focusIdx) => {
    const cur = path.at(-1).node, kids = cur.c || [], max = Math.max(1, ...kids.map((k) => k.v));
    crumbs(); retry.hidden = true;
    rows.innerHTML = kids.length ? '' : '<li class="msg">这一类下暂无数据</li>';
    kids.forEach((k, i) => {
      const li = document.createElement('li'), el = document.createElement(k.c ? 'button' : 'div');
      el.className = 'row' + (k.c ? '' : ' leaf'); el.title = k.n;
      if (k.c) { el.type = 'button'; el.setAttribute('aria-label', `${k.n} ${k.v} 本，查看 ${k.c.length} 个子类`); el.onclick = () => drill(i); }
      el.innerHTML = `<span class="nm">${k.n}</span><span class="tr"><i></i></span><span class="vl">${k.v.toLocaleString()}</span>`;
      li.append(el); rows.append(li);
      requestAnimationFrame(() => requestAnimationFrame(() => el.querySelector('i').style.setProperty('--w', (k.v / max) * 100 + '%')));
    });
    if (focusIdx !== undefined) (rows.querySelectorAll('li')[focusIdx]?.querySelector('button') || rows.querySelector('button') || [...bc.querySelectorAll('button')].pop())?.focus();
  };
  const drill = async (i) => {
    const cur = path.at(-1).node, node = cur.c[i], my = ++seq, had = !!root.activeElement; pending = i;
    crumbs(node); retry.hidden = true; msg.textContent = `正在加载 ${node.n}…`;
    rows.innerHTML = [72, 54, 40, 28].map((w) => `<li><div class="row ske" aria-hidden="true"><span class="nm"></span><span class="tr"><i style="--w:${w}%"></i></span><span class="vl"></span></div></li>`).join('');
    if (had) bc.querySelector('[aria-current]').focus(); // 原按钮被替换，焦点先停在面包屑
    try {
      const kids = await load(node);
      if (my !== seq || !root.host.isConnected) return; // 已有更新的点击，丢弃这次结果
      pending = -1;
      path.push({ node, from: i }); render(had ? 0 : undefined);
      msg.textContent = `已进入 ${node.n}，共 ${kids.length} 个${path.length > 2 ? '条目' : '子类'}`;
    } catch {
      if (my !== seq) return;
      pending = -1;
      render(had ? i : undefined); msg.textContent = `没拿到 ${node.n} 的明细`; retry.hidden = false; retryFn = () => drill(i);
    }
  };
  const up = (level) => { // 回到第 level 层，焦点放回当时点的柱子
    if (level >= path.length - 1 && pending < 0) return;
    seq++; // 作废还没回来的请求
    const back = level < path.length - 1 ? path[level + 1].from : pending; pending = -1; path = path.slice(0, level + 1);
    render(root.activeElement ? back : undefined); msg.textContent = `已回到 ${path.at(-1).node.n}`;
  };
  retry.addEventListener('click', () => retryFn?.());
  root.addEventListener('keydown', (e) => { if (e.key === 'Escape' && (path.length > 1 || pending >= 0)) { e.preventDefault(); up(pending >= 0 ? path.length - 1 : path.length - 2); } });
  root.addEventListener('pointerdown', () => { stop = true; });
  render(); msg.textContent = '点带 › 的分类查看下一层';
  setTimeout(() => { if (!stop && root.host.isConnected && path.length === 1) drill(0); }, 500);
}
</script>
