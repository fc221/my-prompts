<link rel="stylesheet" href="../../_shared/interactions-base.css">
<style>
.st{padding:10px 12px}
.box{display:flex;flex-direction:column;gap:8px;max-width:560px;height:100%;margin:0 auto}
.url{flex:none;display:flex;align-items:center;height:26px;padding:0 10px;overflow:hidden;background:#fff;border:1px solid #e3e6eb;border-radius:999px;color:#5b616e;font:12px/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;white-space:nowrap}
.u b{color:#3b5bdb;font-weight:600}
.u.chg b{animation:fl .8s}
@keyframes fl{from{background:#edf1ff}
}
.fl{flex:none;display:flex;align-items:center;gap:8px}
.seg{flex:none;display:flex;padding:2px;border-radius:8px;background:#e9ecf1}
.seg button{height:26px;padding:0 8px;border:0;border-radius:6px;background:none;color:#5b616e;font-size:12px;white-space:nowrap}
.seg button[aria-checked=true]{background:#fff;color:#1f2329;font-weight:600;box-shadow:0 1px 2px rgba(31,35,41,.12)}
.q{flex:1;min-width:0;height:30px;padding:0 10px;border:1px solid #e3e6eb;border-radius:8px;background:#fff;font-size:12px}
.q:focus{outline:0;border-color:#3b5bdb;box-shadow:0 0 0 3px #edf1ff}
.list{flex:1;min-height:0;margin:0;padding:0 12px;overflow:auto;list-style:none;background:#fff;border:1px solid #e3e6eb;border-radius:10px}
.list li{display:flex;align-items:center;gap:10px;height:30px;border-bottom:1px solid #e3e6eb}
.list li:last-child{border-bottom:0}
.list .hd{height:28px;color:#5b616e;font-size:12px}
.list .hd button,.none button{margin-left:auto;padding:0;border:0;background:none;color:#3b5bdb;font-size:12px}
.list b{flex:1;min-width:0;font-weight:500}
.amt{font-variant-numeric:tabular-nums}
.tag{min-width:48px;padding:0 6px;border-radius:4px;font-size:12px;line-height:20px;text-align:center;background:#f5f6f8;color:#5b616e}
.tag.paid{background:#e6f4ee;color:#12805c}
.tag.unpaid{background:#edf1ff;color:#3b5bdb}
.list li.none{flex-direction:column;justify-content:center;gap:4px;height:100%;border:0;color:#5b616e;font-size:12px;text-align:center}
.none button{margin:0;height:28px;padding:0 10px;border:1px solid #e3e6eb;border-radius:6px;background:#fff;color:#1f2329}
@container (min-width:560px){.list li{height:36px}
}
</style>

<div class="st"><div class="box"><div class="url" aria-label="地址栏示意"><span class="u"></span></div><div class="fl"><div class="seg" role="radiogroup" aria-label="订单状态"></div><input class="q" type="search" placeholder="搜客户" aria-label="按客户搜索"></div><ul class="list" aria-live="polite"></ul></div></div>

<script type="module">
export default function demo(root) {
  const D = [['林知远', 1280, '已付款'], ['苏墨', 356.5, '待付款'], ['陈一鸣', 2990, '已退款'], ['何小满', 89, '已付款'], ['周以宁', 15600, '已付款'], ['林晓', 640, '待付款']];
  const S = [['全部', ''], ['待付款', 'unpaid'], ['已付款', 'paid'], ['已退款', 'refunded']];
  const seg = root.querySelector('.seg'), q = root.querySelector('.q'), list = root.querySelector('.list'), u = root.querySelector('.u');
  let st = 0, kw = '', deb = 0;
  const fmt = (v) => '¥' + v.toLocaleString('zh-CN', { minimumFractionDigits: 2 });
  S.forEach(([n], i) => { const b = document.createElement('button'); b.type = 'button'; b.setAttribute('role', 'radio'); b.textContent = n; b.onclick = () => pick(i); seg.append(b); });
  const btns = [...seg.children];
  const url = () => { // 默认值不写进参数；真实页面用 history.replaceState 同步
    const p = new URLSearchParams(); if (S[st][1]) p.set('status', S[st][1]); if (kw) p.set('q', kw);
    u.textContent = '/orders'; const s = p.toString();
    if (s) { const b = document.createElement('b'); b.textContent = '?' + decodeURIComponent(s.replace(/\+/g, ' ')); u.append(b); }
    u.classList.remove('chg'); void u.offsetWidth; u.classList.add('chg');
  };
  const clear = () => { st = 0; kw = ''; q.value = ''; render(); q.focus(); };
  const render = () => {
    btns.forEach((b, i) => { b.setAttribute('aria-checked', String(i === st)); b.tabIndex = i === st ? 0 : -1; });
    const rows = D.filter((d) => (!st || d[2] === S[st][0]) && (!kw || d[0].includes(kw)));
    list.replaceChildren();
    if (!rows.length) {
      const li = document.createElement('li'); li.className = 'none';
      const cond = [st ? S[st][0] : '', kw].filter(Boolean).join(' + ');
      li.append(`没有符合「${cond}」的订单`); const b = document.createElement('button'); b.type = 'button'; b.textContent = '清除筛选'; b.onclick = clear; li.append(b); list.append(li);
    } else {
      const hd = document.createElement('li'); hd.className = 'hd'; hd.append(`${rows.length} 条结果`);
      if (st || kw) { const b = document.createElement('button'); b.type = 'button'; b.textContent = '清除筛选'; b.onclick = clear; hd.append(b); }
      list.append(hd);
      rows.forEach(([n, a, s]) => { const li = document.createElement('li'); li.innerHTML = `<b>${n}</b><span class="amt">${fmt(a)}</span><span class="tag ${S.find((x) => x[0] === s)[1]}">${s}</span>`; list.append(li); });
    }
    url();
  };
  const pick = (i) => { st = i; render(); };
  seg.addEventListener('keydown', (e) => { const d = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key]; if (!d) return; e.preventDefault(); pick((st + d + S.length) % S.length); btns[st].focus(); });
  q.addEventListener('input', () => { clearTimeout(deb); deb = setTimeout(() => { if (!root.host.isConnected) return; kw = q.value.trim(); render(); }, 300); });
  st = 2; render();
}
</script>
