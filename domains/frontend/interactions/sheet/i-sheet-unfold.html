<link rel="stylesheet" href="../../_shared/app-sheet-base.css">
<style>
.app{max-width:440px;margin:0 auto;padding:12px 16px}
.top b{font-size:16px}
.open{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;margin-top:10px;padding:12px 14px;border:1px solid #e3e6eb;border-radius:14px;background:#fff;text-align:left}
.open span{display:grid;min-width:0}
.open b,.open small{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.open small{color:#5b616e;font-size:12px}
.open em{flex:none;padding:0 8px;border-radius:999px;background:#e6f4ee;color:#12805c;font-size:12px;font-style:normal;line-height:22px}
.scrim{position:absolute;inset:0;background:rgba(17,20,28,.45);opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s}
.on .scrim{opacity:1;visibility:visible;transition:opacity .3s}
.tk{position:absolute;left:12px;right:12px;top:52px;max-width:380px;margin:0 auto;filter:drop-shadow(0 8px 20px rgba(0,0,0,.2));transform:translateY(100cqh);visibility:hidden;transition:transform .24s cubic-bezier(.4,0,1,1),visibility 0s .24s}
.on .tk{transform:none;visibility:visible;transition:transform .34s cubic-bezier(.2,.8,.2,1)}
.sm{padding:14px 16px;border-radius:16px;background:#fff;touch-action:none;user-select:none}
.open-t .sm{border-radius:16px 16px 4px 4px;-webkit-mask:radial-gradient(circle 7px at 0 100%,#0000 98%,#000) 0 0/51% 100% no-repeat,radial-gradient(circle 7px at 100% 100%,#0000 98%,#000) 100% 0/51% 100% no-repeat;mask:radial-gradient(circle 7px at 0 100%,#0000 98%,#000) 0 0/51% 100% no-repeat,radial-gradient(circle 7px at 100% 100%,#0000 98%,#000) 100% 0/51% 100% no-repeat}
.r1,.r2{display:flex;align-items:center;gap:8px}
.r2{margin-top:6px}
h3{flex:1;min-width:0;overflow:hidden;font-size:18px;white-space:nowrap;text-overflow:ellipsis}
h3 i{margin:0 6px;color:#8a909b;font-style:normal}
.x{flex:none;width:30px;height:30px;padding:0;border:0;border-radius:50%;background:#f0f2f5;font-size:16px;line-height:1}
.r2 span{flex:1;min-width:0;overflow:hidden;color:#5b616e;font-size:12px;white-space:nowrap;text-overflow:ellipsis}
.tg{flex:none;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border:1px solid #d0d5dd;border-radius:999px;background:#fff;font-size:12px;font-weight:600}
.tg::after{content:"";width:6px;height:6px;border:solid currentColor;border-width:0 1.5px 1.5px 0;transform:translateY(-2px) rotate(45deg);transition:transform .2s}
.open-t .tg::after{transform:translateY(1px) rotate(-135deg)}
.fold{perspective:600px}
.stub{--sd:1;position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;padding:14px 16px;border-top:2px dashed #d5d9e0;border-radius:4px 4px 16px 16px;background:#fff;transform-origin:50% 0;transform:rotateX(-90deg);visibility:hidden;transition:transform .42s cubic-bezier(.2,.8,.2,1),visibility 0s .42s;-webkit-mask:radial-gradient(circle 7px at 0 0,#0000 98%,#000) 0 0/51% 100% no-repeat,radial-gradient(circle 7px at 100% 0,#0000 98%,#000) 100% 0/51% 100% no-repeat;mask:radial-gradient(circle 7px at 0 0,#0000 98%,#000) 0 0/51% 100% no-repeat,radial-gradient(circle 7px at 100% 0,#0000 98%,#000) 100% 0/51% 100% no-repeat}
.open-t .stub{--sd:0;transform:none;visibility:visible;transition:transform .42s cubic-bezier(.2,.8,.2,1)}
.stub::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(20,24,32,.3),rgba(20,24,32,.06));opacity:var(--sd);transition:opacity .42s;pointer-events:none}
.stub.dr,.stub.dr::after{transition:none}
.inf{display:grid;gap:6px;min-width:0}
dl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0}
dl div{min-width:0}
dt{color:#5b616e;font-size:11px}
dd{margin:0;overflow:hidden;font-weight:600;white-space:nowrap;text-overflow:ellipsis}
.cd{color:#3a3f48;font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.qr{width:88px;height:88px}
.qr svg{display:block;width:100%;height:100%;fill:#1f2329}
@container (max-height:260px){.tk{top:46px}
.sm{padding:8px 12px}
.r2{margin-top:2px}
h3{font-size:15px}
.x{width:24px;height:24px;font-size:14px}
.tg{height:26px}
.stub{gap:10px;padding:8px 12px}
.inf{gap:4px}
dl{gap:8px}
.qr{width:56px;height:56px}
}
</style>

<div class="st"><div class="app"><div class="top"><b>我的行程</b></div><button type="button" class="open" aria-haspopup="dialog"><span><b>北岭 → 南湾</b><small>明天 08:15 · 城际 C2817</small></span><em>出票成功</em></button></div><div class="scrim"></div><section class="tk" role="dialog" aria-modal="true" aria-labelledby="tk-t"><div class="sm"><div class="r1"><h3 id="tk-t">北岭<i aria-hidden="true">→</i><span class="sr">到</span>南湾</h3><button type="button" class="x" aria-label="关闭">×</button></div><div class="r2"><span>明天 08:15 开 · 07 车 12F</span><button type="button" class="tg" aria-expanded="false" aria-controls="tk-s">展开</button></div></div><div class="fold"><div class="stub" id="tk-s"><div class="inf"><dl><div><dt>乘车人</dt><dd>林小舟</dd></div><div><dt>检票口</dt><dd>A12</dd></div><div><dt>车次</dt><dd>C2817</dd></div></dl><p class="cd">核销码 8203 5617</p></div><div class="qr"></div></div></div></section><button type="button" class="ctl rp">重播</button><p class="sr" role="status"></p></div>

<script type="module">
export default function demo(root) {
  const st = root.querySelector('.st'), app = root.querySelector('.app'), open = root.querySelector('.open'), tk = root.querySelector('.tk'), sm = root.querySelector('.sm'), stub = root.querySelector('.stub'), tg = root.querySelector('.tg'), x = root.querySelector('.x'), say = root.querySelector('.st>.sr');
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  // 示意用的二维码：三个定位角 + 固定种子的随机格子
  let s = 7, cells = '';
  const fin = (a, b) => `M${a} ${b}h7v7h-7zM${a + 1} ${b + 1}v5h5v-5zM${a + 2} ${b + 2}h3v3h-3z`;
  for (let y = 0; y < 21; y++) for (let x0 = 0; x0 < 21; x0++) { s = (s * 9301 + 49297) % 233280; const corner = (x0 < 8 && y < 8) || (x0 > 12 && y < 8) || (x0 < 8 && y > 12); if (!corner && s / 233280 > 0.52) cells += `M${x0} ${y}h1v1h-1z`; }
  root.querySelector('.qr').innerHTML = `<svg viewBox="0 0 21 21" aria-hidden="true"><path fill-rule="evenodd" d="${fin(0, 0) + fin(14, 0) + fin(0, 14) + cells}"/></svg>`;
  let isOpen = false, d = null, tm = [];
  const fold = (o, quiet) => {
    isOpen = o; tk.classList.toggle('open-t', o); tg.setAttribute('aria-expanded', String(o)); tg.textContent = o ? '收起' : '展开'; stub.inert = !o;
    stub.classList.remove('dr'); stub.style.transform = stub.style.visibility = ''; stub.style.removeProperty('--sd');
    if (!quiet) say.textContent = o ? '已展开票根，核销码 8203 5617' : '已收起票根';
  };
  const show = (focus) => { tm.forEach(clearTimeout); tm = []; fold(false, true); st.classList.add('on'); app.inert = true; if (focus) tg.focus({ preventScroll: true }); };
  const hide = () => { tm.forEach(clearTimeout); st.classList.remove('on'); app.inert = false; open.focus({ preventScroll: true }); };
  tg.onclick = () => fold(!isOpen);
  // 拖摘要：移动超过 6px 才算拖动并捕获指针，票根角度跟手；松手按 35% 阈值或速度切换
  sm.addEventListener('pointerdown', (e) => { if (e.button > 0) return; d = { y: e.clientY, ly: e.clientY, lt: e.timeStamp, v: 0, from: +isOpen, p: +isOpen, id: e.pointerId, on: false }; });
  sm.addEventListener('pointermove', (e) => {
    if (!d) return; const dy = e.clientY - d.y;
    if (!d.on) { if (Math.abs(dy) < 6) return; d.on = true; sm.setPointerCapture(d.id); stub.classList.add('dr'); stub.style.visibility = 'visible'; }
    d.v = (e.clientY - d.ly) / Math.max(1, e.timeStamp - d.lt); d.ly = e.clientY; d.lt = e.timeStamp;
    d.p = Math.max(0, Math.min(1, d.from + dy / stub.offsetHeight));
    stub.style.transform = `rotateX(${(d.p - 1) * 90}deg)`; stub.style.setProperty('--sd', 1 - d.p);
  });
  const up = () => { if (!d) return; const g = d; d = null; if (!g.on) return; void stub.offsetWidth; fold(g.v > 0.5 ? true : g.v < -0.5 ? false : g.p > (g.from ? 0.65 : 0.35)); };
  sm.addEventListener('pointerup', up); sm.addEventListener('pointercancel', up);
  open.onclick = () => show(true); x.onclick = hide; root.querySelector('.scrim').onclick = hide;
  root.addEventListener('keydown', (e) => { if (e.key === 'Escape' && st.classList.contains('on')) hide(); });
  const play = () => { show(false); tm.push(setTimeout(() => { if (root.host.isConnected) fold(true, true); }, still ? 0 : 560)); };
  root.querySelector('.rp').onclick = () => { st.classList.add('nt'); st.classList.remove('on'); fold(false, true); void st.offsetWidth; st.classList.remove('nt'); void st.offsetWidth; play(); };
  setTimeout(() => { if (root.host.isConnected) play(); }, 120);
}
</script>
