<link rel="stylesheet" href="../../_shared/app-sheet-base.css">
<style>
.app{max-width:440px;margin:0 auto;padding:12px 16px}
.top{display:flex;align-items:baseline;gap:8px}
.top b{font-size:16px}
.top small{color:#5b616e;font-size:12px}
.open{display:flex;align-items:center;justify-content:space-between;width:100%;height:40px;margin-top:10px;padding:0 14px;border:1px solid #e3e6eb;border-radius:12px;background:#fff;font-weight:600}
.open em{color:#8a909b;font-size:18px;font-style:normal}
.list{list-style:none;margin-top:6px}
.list li{display:flex;align-items:center;gap:10px;height:34px;border-bottom:1px solid #eceef1}
.list i{flex:none;width:8px;height:8px;border-radius:50%}
.c1{background:#7c8cf8}
.c2{background:#f59e0b}
.c3{background:#10b981}
.list span{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.list em{color:#5b616e;font-style:normal;font-variant-numeric:tabular-nums}
.scrim{position:absolute;inset:0;background:rgba(10,12,18,.42);opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s}
.on .scrim{opacity:1;visibility:visible;transition:opacity .3s}
.sh{position:absolute;left:0;right:0;bottom:0;max-width:440px;margin:0 auto;padding:0 18px 16px;border-radius:20px 20px 0 0;background:#17191f;color:#f2f3f5;transform:translateY(100%);visibility:hidden;transition:transform .24s cubic-bezier(.4,0,1,1),visibility 0s .24s}
.on .sh{transform:none;visibility:visible;transition:transform .36s cubic-bezier(.2,.8,.2,1)}
.sh :focus-visible{outline-color:#9be26a}
.grab{display:block;width:36px;height:4px;margin:8px auto 10px;border-radius:2px;background:rgba(255,255,255,.22)}
.bd{display:flex;align-items:center;gap:20px}
.ring{position:relative;flex:none;width:132px;height:132px}
.ring svg{display:block;width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.bg{stroke:rgba(255,255,255,.1)}
.fg{stroke:#9be26a;stroke-linecap:round;stroke-dasharray:263.9;stroke-dashoffset:263.9;opacity:0}
.c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.2}
.n{display:inline-block;min-width:4ch;font-size:30px;font-variant-numeric:tabular-nums}
.c small{color:#a8adb7;font-size:12px}
.info{flex:1;min-width:0;display:grid;gap:2px}
h3{font-size:16px}
.info p{overflow:hidden;color:#c3c7cf;white-space:nowrap;text-overflow:ellipsis}
.pc{display:inline-block;min-width:3.2ch;color:#9be26a;font-variant-numeric:tabular-nums}
.done{justify-self:start;height:34px;margin-top:8px;padding:0 18px;border:0;border-radius:999px;background:#f2f3f5;color:#17191f;font-weight:600}
@container (max-height:260px){.sh{padding:0 16px 12px}
.grab{margin:6px auto 8px}
.bd{gap:14px}
.ring{width:96px;height:96px}
.n{font-size:22px}
h3{font-size:15px}
.done{height:30px;margin-top:4px}
}
</style>

<div class="st"><div class="app"><div class="top"><b>专注</b><small>10 月第 4 周</small></div><button type="button" class="open" aria-haspopup="dialog"><span>本周统计</span><em aria-hidden="true">›</em></button><ul class="list"><li><i class="c1"></i><span>需求评审</span><em>50 分钟</em></li><li><i class="c2"></i><span>写周报</span><em>25 分钟</em></li><li><i class="c3"></i><span>读论文</span><em>90 分钟</em></li></ul></div><div class="scrim"></div><section class="sh" role="dialog" aria-modal="true" aria-labelledby="rg-t"><i class="grab" aria-hidden="true"></i><div class="bd"><div class="ring"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="bg" cx="50" cy="50" r="42"/><circle class="fg" cx="50" cy="50" r="42"/></svg><div class="c"><b class="n">0</b><small>分钟</small></div></div><div class="info"><h3 id="rg-t">本周专注</h3><p>已达成目标的 <b class="pc">0%</b></p><p class="sub">比上周多 128 分钟</p><button type="button" class="done">完成</button></div></div></section><button type="button" class="ctl rp">重播</button><p class="sr" role="status"></p></div>

<script type="module">
export default function demo(root) {
  const st = root.querySelector('.st'), app = root.querySelector('.app'), open = root.querySelector('.open'), fg = root.querySelector('.fg'), n = root.querySelector('.n'), pc = root.querySelector('.pc'), done = root.querySelector('.done'), say = root.querySelector('.sr');
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches, C = 263.9, GOAL = 1200, VAL = 912;
  let tm = 0, raf = 0;
  // 圆环、分钟数、百分比都由同一个进度值 e 算出，保证同步
  const set = (e) => { fg.style.opacity = e ? 1 : 0; fg.style.strokeDashoffset = C * (1 - VAL / GOAL * e); n.textContent = Math.round(VAL * e); pc.textContent = Math.round(VAL / GOAL * 100 * e) + '%'; };
  const report = () => { say.textContent = `本周专注 ${VAL} 分钟，达成目标的 ${Math.round(VAL / GOAL * 100)}%`; };
  const count = () => {
    let t0;
    const step = (t) => { if (!root.host.isConnected) return; t0 ??= t; const p = Math.min(1, (t - t0) / 800); set(1 - (1 - p) ** 3); if (p < 1) raf = requestAnimationFrame(step); else report(); };
    raf = requestAnimationFrame(step);
  };
  const show = (focus) => { clearTimeout(tm); cancelAnimationFrame(raf); set(0); st.classList.add('on'); app.inert = true; if (focus) done.focus({ preventScroll: true }); if (still) { set(1); report(); } else tm = setTimeout(count, 360); };
  const hide = () => { clearTimeout(tm); cancelAnimationFrame(raf); st.classList.remove('on'); app.inert = false; open.focus({ preventScroll: true }); };
  open.onclick = () => show(true); done.onclick = hide; root.querySelector('.scrim').onclick = hide;
  root.addEventListener('keydown', (e) => { if (e.key === 'Escape' && st.classList.contains('on')) hide(); });
  root.querySelector('.rp').onclick = () => { st.classList.add('nt'); st.classList.remove('on'); void st.offsetWidth; st.classList.remove('nt'); void st.offsetWidth; show(false); };
  setTimeout(() => { if (root.host.isConnected) show(false); }, 150);
}
</script>
