<link rel="stylesheet" href="../../_shared/app-sheet-base.css">
<style>
.app{max-width:440px;margin:0 auto;padding:12px 14px}
.top{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.top b{font-size:16px}
.top span{color:#5b616e;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.card{display:grid;min-width:0;padding:6px 6px 8px;border:1px solid #e3e6eb;border-radius:14px;background:#fff;text-align:left}
.card .ph{display:block;aspect-ratio:4/3;margin-bottom:4px;border-radius:10px}
.card b,.card small{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.card small{color:#5b616e;font-size:11px}
.gone .ph{visibility:hidden}
.p0{background:radial-gradient(ellipse 50% 22% at 30% 60%,rgba(255,255,255,.9),transparent 70%),linear-gradient(170deg,#9dbcd8 0%,#dfe9f2 44%,#6f8ea8 45%,#a9c2d6 68%,#e6eef5 100%)}
.p1{background:radial-gradient(circle at 50% 50%,#3b3f5c 0 2px,transparent 3px),linear-gradient(180deg,#f3bfcd 0%,#c7d6f3 46%,#fff 50%,#c7d6f3 54%,#f3bfcd 100%)}
.p2{background:linear-gradient(#cfe7f3,#e8f3e6) 0 0/100% 34% no-repeat,repeating-radial-gradient(ellipse 140% 100% at 40% 140%,#8cc56f 0 10px,#5e9e52 10px 13px,#a8d486 13px 22px)}
.ov{position:absolute;inset:0;z-index:5;background:rgba(17,20,28,0);transition:background .3s}
.ov.in{background:rgba(17,20,28,.45)}
.pg{position:relative;max-width:440px;height:100%;margin:0 auto;overflow:hidden}
.hero{position:absolute;left:0;right:0;top:0;height:56%;transform-origin:0 0}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 30%,rgba(0,0,0,.58))}
.cap{position:absolute;left:16px;right:16px;bottom:calc(44% + 22px);display:grid;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.35);opacity:0;transition:opacity .2s}
.up .cap{opacity:1;transition:opacity .3s .1s}
.cap h3{overflow:hidden;font-size:18px;line-height:1.25;white-space:nowrap;text-overflow:ellipsis}
.cap small{font-size:12px}
.x{position:absolute;left:10px;top:10px;width:32px;height:32px;padding:0;border:0;border-radius:50%;background:rgba(0,0,0,.38);color:#fff;font-size:18px;line-height:1;opacity:0;transition:opacity .2s}
.in .x{opacity:1}
.dw{position:absolute;left:0;right:0;bottom:0;top:calc(56% - 16px);padding:14px 16px;border-radius:16px 16px 0 0;background:#fff;transform:translateY(100%);transition:transform .24s cubic-bezier(.4,0,1,1)}
.up .dw{transform:none;transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.meta{overflow:hidden;color:#5b616e;font-size:12px;white-space:nowrap;text-overflow:ellipsis}
.meta b{color:#c2410c}
.ds{display:-webkit-box;margin-top:4px;overflow:hidden;color:#3a3f48;-webkit-box-orient:vertical;-webkit-line-clamp:2}
.acts{display:flex;gap:8px;margin-top:10px}
.acts button{height:34px;padding:0 16px;border-radius:999px;font-weight:600;white-space:nowrap}
.pri{border:0;background:#1f2329;color:#fff}
.sec{border:1px solid #d0d5dd;background:#fff}
@container (max-height:260px){.app{padding-top:10px}
.top{margin-bottom:8px}
.dw{padding:10px 14px}
.cap h3{font-size:16px}
.ds{margin-top:2px;-webkit-line-clamp:1}
.acts{margin-top:8px}
.acts button{height:30px;padding:0 14px}
}
</style>

<div class="st"><div class="app"><div class="top"><b>想去的地方</b><span>3 处</span></div><div class="grid"><button type="button" class="card" data-i="0"><i class="ph p0"></i><b>雾松湾</b><small>北岭 · 冬季</small></button><button type="button" class="card" data-i="1"><i class="ph p1"></i><b>镜盐湖</b><small>西原 · 夏季</small></button><button type="button" class="card" data-i="2"><i class="ph p2"></i><b>云阶梯田</b><small>南山 · 春季</small></button></div></div><div class="ov" role="dialog" aria-modal="true" aria-labelledby="pd-t" hidden><div class="pg"><i class="hero ph"></i><div class="cap"><h3 id="pd-t"></h3><small></small></div><button type="button" class="x" aria-label="关闭">×</button><div class="dw"><p class="meta"></p><p class="ds"></p><div class="acts"><button type="button" class="pri">加入行程</button><button type="button" class="sec">分享</button></div></div></div></div><button type="button" class="ctl rp">重播</button><p class="sr" role="status"></p></div>

<script type="module">
export default function demo(root) {
  const app = root.querySelector('.app'), ov = root.querySelector('.ov'), hero = root.querySelector('.hero'), h = ov.querySelector('h3'), sub = ov.querySelector('.cap small'), meta = ov.querySelector('.meta'), ds = ov.querySelector('.ds'), x = ov.querySelector('.x'), say = root.querySelector('.sr'), cards = [...root.querySelectorAll('.card')];
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const INFO = [
    ['雾松湾', '北岭 · 冬季', '<b>4.8 分</b> · 距你 12 km · 适合 1 天', '清晨湖面起雾，岸边松枝挂满冰晶，日出前后半小时最好拍，记得带防滑鞋。'],
    ['镜盐湖', '西原 · 夏季', '<b>4.7 分</b> · 距你 86 km · 适合 2 天', '无风的傍晚湖面像一面镜子，天空和人的倒影几乎对称，穿亮色衣服更出片。'],
    ['云阶梯田', '南山 · 春季', '<b>4.9 分</b> · 距你 40 km · 适合 1 天', '四月灌水后层层梯田反光，山脚观景台视野最好，雨后常有云海。'],
  ];
  let from = null, tm = 0;
  const fly = (rev) => {
    const a = from.querySelector('.ph').getBoundingClientRect(), b = hero.getBoundingClientRect();
    const k = [{ transform: `translate(${a.left - b.left}px,${a.top - b.top}px) scale(${a.width / b.width},${a.height / b.height})`, borderRadius: '10px' }, { transform: 'none', borderRadius: '0px' }];
    return hero.animate(rev ? k.reverse() : k, { duration: rev ? 320 : 380, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'both' });
  };
  const reset = () => { clearTimeout(tm); hero.getAnimations().forEach((a) => a.cancel()); ov.hidden = true; ov.classList.remove('in', 'up'); app.inert = false; from?.classList.remove('gone'); };
  const open = (c, focus) => {
    reset(); from = c; const i = +c.dataset.i;
    hero.className = 'hero ph p' + i; h.textContent = INFO[i][0]; sub.textContent = INFO[i][1]; meta.innerHTML = INFO[i][2]; ds.textContent = INFO[i][3];
    ov.hidden = false; app.inert = true; c.classList.add('gone'); void ov.offsetWidth;
    if (focus) x.focus({ preventScroll: true });
    say.textContent = `${INFO[i][0]}，${INFO[i][1]}`;
    if (still) { ov.classList.add('in', 'up'); return; }
    ov.classList.add('in'); fly();
    tm = setTimeout(() => ov.classList.add('up'), 340); // 照片快落定时抽屉跟上
  };
  // 关闭倒序：先收抽屉，再把照片缩回卡片，最后还焦点
  const close = () => {
    if (ov.hidden) return; const c = from;
    const end = () => { reset(); c.focus({ preventScroll: true }); };
    clearTimeout(tm); ov.classList.remove('up');
    if (still) return end();
    tm = setTimeout(() => { ov.classList.remove('in'); fly(true).finished.then(end, () => {}); }, 240);
  };
  cards.forEach((c) => { c.onclick = () => open(c, true); });
  x.onclick = close;
  root.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
  root.querySelector('.rp').onclick = () => open(cards[1], false);
  setTimeout(() => { if (root.host.isConnected) open(cards[1], false); }, 250);
}
</script>
