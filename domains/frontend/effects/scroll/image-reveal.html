<style>
:host{display:block;height:100%}
.page{height:100%;overflow:auto;background:#f7f5f2;color:#1f2329;font:14px/1.5 system-ui,"PingFang SC",sans-serif}
.hint{height:150px;margin:0;display:grid;place-items:center;color:#6b6f76}
figure{margin:0 24px}
.img{height:170px;border-radius:14px;overflow:hidden;clip-path:inset(0 100% 0 0 round 14px);transition:clip-path .9s cubic-bezier(.65,0,.35,1)}
.ph{height:100%;display:grid;place-items:center;background:linear-gradient(135deg,#f6d2a8,#c7d7fb);transform:scale(1.08);transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.ph svg{width:64px;fill:rgba(255,255,255,.8)}
.img.in{clip-path:inset(0 0 0 0 round 14px)}
.img.in .ph{transform:none}
figcaption{margin-top:8px;color:#5b616e;font-size:13px}
.pad{height:180px;margin:0}
@media (prefers-reduced-motion:reduce){.img{clip-path:none;transition:none}
.ph{transform:none;transition:none}
}
</style>

<div class="page"><p class="hint">向下滚动</p><figure><div class="img"><div class="ph"><svg viewBox="0 0 48 36" aria-hidden="true"><circle cx="34" cy="10" r="5"/><path d="M0 36 L16 16 L26 27 L32 21 L48 36 Z"/></svg></div></div><figcaption>新仓启用后，华东区次日达覆盖率提升到 92%</figcaption></figure><p class="pad"></p></div>

<script type="module">
export default function demo(root) {
  // 监听没被裁剪的外层 figure：图片自己被 clip-path 裁成 0 宽时，浏览器算出的可见比例一直是 0
  const page = root.querySelector('.page'), img = root.querySelector('.img'); const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { img.classList.add('in'); io.disconnect(); } }), { root: page, threshold: .3 }); io.observe(root.querySelector('figure'));
}
</script>
