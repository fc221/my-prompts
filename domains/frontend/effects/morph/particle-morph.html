<link rel="stylesheet" href="../../_shared/interactions-base.css">
<style>
.st{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);background:radial-gradient(80% 100% at 75% 50%,#1b2233,#0c0f17);color:#eef1f7}
.tx{display:flex;flex-direction:column;justify-content:center;gap:4px;min-width:0;padding:12px 0 12px 16px}
.tx small{color:#8f98ab;font-size:11px;letter-spacing:.04em;white-space:nowrap}
.tx h3{margin:0;font-size:18px;line-height:1.3;color:var(--c,#fbbf24);transition:color .3s}
.tx p{margin:0 0 6px;color:#b9c0cf;font-size:12px;line-height:1.5}
.seg{display:flex;gap:4px}
.seg button{height:28px;padding:0 10px;border:1px solid rgba(238,241,247,.16);border-radius:14px;background:none;color:#b9c0cf;font-size:12px;white-space:nowrap}
.seg button:hover{border-color:rgba(238,241,247,.4);color:#fff}
.seg button[aria-pressed=true]{border-color:transparent;background:#eef1f7;color:#0c0f17;font-weight:600}
.seg button:focus-visible{outline-color:#93c5fd}
canvas{display:block;width:100%;height:100%;min-height:0}
@container (max-width:310px){.tx{padding-left:12px}
.seg button{padding:0 8px}
}
@container (min-height:260px){.tx{gap:6px;padding:24px 0 24px 32px}
.tx small{font-size:12px}
.tx h3{font-size:26px}
.tx p{margin-bottom:12px;font-size:14px}
.seg{gap:6px}
.seg button{height:32px;padding:0 14px;font-size:13px}
}
</style>

<div class="st"><div class="tx"><small>MyPrompts</small><h3></h3><p></p><div class="seg" role="group" aria-label="记录方式"><button type="button" data-i="0" aria-pressed="false">拍照</button><button type="button" data-i="1" aria-pressed="false">语音</button><button type="button" data-i="2" aria-pressed="false">手写</button></div><span class="sr" role="status"></span></div><canvas aria-hidden="true"></canvas></div>

<script type="module">
export default function demo(root) {
  // 三个目标形状画在 24×24 的格子里；同一批粒子（下标固定）在它们之间换目标位置
  const M = [
    ['拍下来', '对着白板拍一张，文字自动识别成笔记。', '#fbbf24', (g) => { g.beginPath(); g.roundRect(2.5, 7, 19, 13, 2.5); g.moveTo(8, 7); g.lineTo(9.5, 4.5); g.lineTo(14.5, 4.5); g.lineTo(16, 7); g.fill(); g.globalCompositeOperation = 'destination-out'; g.beginPath(); g.arc(12, 13.5, 3.6, 0, 7); g.fill(); g.globalCompositeOperation = 'source-over'; }],
    ['说出来', '边走边说，语音实时转成文字并标出重点。', '#5eead4', (g) => { g.beginPath(); g.roundRect(8.5, 2, 7, 12.5, 3.5); g.fill(); g.lineWidth = 1.8; g.beginPath(); g.arc(12, 10.5, 6.2, 0.15, Math.PI - 0.15); g.stroke(); g.fillRect(11.1, 16.5, 1.8, 4); g.fillRect(8, 20.2, 8, 1.8); }],
    ['写下来', '用笔随手圈画，手写和图形都能搜索。', '#c4b5fd', (g) => { g.save(); g.translate(12, 11); g.rotate(-Math.PI / 4); g.fillRect(-2.2, -9, 4.4, 13); g.beginPath(); g.moveTo(-2.2, 4.8); g.lineTo(2.2, 4.8); g.lineTo(0, 8.6); g.fill(); g.restore(); g.lineWidth = 1.6; g.beginPath(); g.moveTo(3, 21); g.bezierCurveTo(7, 17.5, 9, 23.5, 13, 20.5); g.stroke(); }],
  ];
  const c = root.querySelector('canvas'), g = c.getContext('2d'), h3 = root.querySelector('h3'), p = root.querySelector('.tx p'), msg = root.querySelector('[role=status]'), btns = [...root.querySelectorAll('.seg button')];
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W = 0, H = 0, R = 1, pts = [], targets = [], mode = -1, raf = 0, t0 = 0;
  const rnd = (s) => () => ((s = (s * 16807) % 2147483647) / 2147483647); // 固定种子：每次打乱的顺序一样，同一个粒子总是去同一个位置
  // 把形状画到离屏画布上，按网格取不透明的像素，得到目标点
  const sample = (draw) => {
    const box = Math.min(W, H) * 0.78, step = Math.max(3, box / 36), o = new OffscreenCanvas(Math.ceil(box), Math.ceil(box)), og = o.getContext('2d');
    R = step * 0.2; og.scale(box / 24, box / 24); og.fillStyle = og.strokeStyle = '#000'; og.lineCap = 'round'; draw(og);
    const d = og.getImageData(0, 0, o.width, o.height).data, out = [], ox = (W - box) / 2, oy = (H - box) / 2;
    for (let y = step / 2; y < box; y += step) for (let x = step / 2; x < box; x += step) if (d[(Math.floor(y) * o.width + Math.floor(x)) * 4 + 3] > 128) out.push([ox + x, oy + y]);
    const r = rnd(7); for (let i = out.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [out[i], out[j]] = [out[j], out[i]]; }
    return out;
  };
  const fit = () => {
    const dpr = Math.min(2, devicePixelRatio || 1); W = c.clientWidth; H = c.clientHeight; if (!W || !H) return false;
    c.width = W * dpr; c.height = H * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0);
    targets = M.map((m) => sample(m[3])); const n = Math.max(...targets.map((t) => t.length)), r = rnd(3);
    if (pts.length !== n) pts = Array.from({ length: n }, () => ({ x: r() * W, y: r() * H, vx: 0, vy: 0, tx: 0, ty: 0, d: r() * 260, s: 1 + r() * 0.9 }));
    return true;
  };
  const draw = () => {
    g.clearRect(0, 0, W, H); g.fillStyle = M[mode][2];
    for (const q of pts) { g.globalAlpha = 0.55 + 0.45 * (q.s - 1) / 0.9; g.beginPath(); g.arc(q.x, q.y, q.s * R, 0, 7); g.fill(); }
    g.globalAlpha = 1;
  };
  // 弹簧：每个粒子按自己的延迟出发，先被一股向外的力“散开”，再被拉向新目标“聚拢”；全部停稳后停止渲染
  const tick = (t) => {
    if (!root.host.isConnected) return;
    let moving = false;
    for (const q of pts) {
      if (t - t0 < q.d) { moving = true; continue; }
      q.vx = (q.vx + (q.tx - q.x) * 0.045) * 0.86; q.vy = (q.vy + (q.ty - q.y) * 0.045) * 0.86; q.x += q.vx; q.y += q.vy;
      if (Math.abs(q.vx) + Math.abs(q.vy) > 0.03 || Math.abs(q.tx - q.x) + Math.abs(q.ty - q.y) > 0.3) moving = true;
    }
    draw(); raf = moving ? requestAnimationFrame(tick) : 0;
  };
  const set = (i, burst = true) => {
    mode = i; const m = M[i], tg = targets[i];
    h3.textContent = m[0]; p.textContent = m[1]; h3.style.setProperty('--c', m[2]);
    btns.forEach((b) => b.setAttribute('aria-pressed', String(+b.dataset.i === i)));
    pts.forEach((q, k) => { const [x, y] = tg[k % tg.length], dup = k >= tg.length; q.tx = x + (dup ? (k % 3) - 1 : 0) * 0.8; q.ty = y + (dup ? ((k >> 1) % 3) - 1 : 0) * 0.8; if (burst) { const a = Math.random() * 7, f = 2 + Math.random() * 3; q.vx += Math.cos(a) * f; q.vy += Math.sin(a) * f; } });
    if (reduce) return snap();
    t0 = performance.now(); if (!raf) raf = requestAnimationFrame(tick);
  };
  btns.forEach((b) => b.addEventListener('click', () => { const i = +b.dataset.i; if (i === mode) return; set(i); msg.textContent = `已切换到${b.textContent}：${M[i][1]}`; }));
  const snap = () => { cancelAnimationFrame(raf); raf = 0; pts.forEach((q) => { q.x = q.tx; q.y = q.ty; q.vx = q.vy = 0; }); draw(); };
  // 尺寸变了就重新取样并直接落到新位置（不重播）；rAF 在页面隐藏时浏览器会自动暂停
  new ResizeObserver(() => { if (c.clientWidth === W && c.clientHeight === H) return; if (!fit()) return; if (mode < 0) return set(0, false); set(mode, false); snap(); }).observe(c);
  // 首次：粒子从随机位置聚成第一个形状
  if (fit()) set(0, false);
}
</script>
