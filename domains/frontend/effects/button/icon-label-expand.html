<link rel="stylesheet" href="../../_shared/app-card-base.css">
<style>
.st{display:grid;align-content:center;justify-items:center;gap:14px;padding:12px 16px}
.bar{display:flex;gap:4px;padding:4px;border-radius:24px}
.nav{background:#fff;box-shadow:0 1px 3px rgba(16,24,40,.1)}
.tool{background:#1f2329;color:#e6e8ec}
.ib{display:inline-flex;align-items:center;height:40px;padding:0 10px;border:0;border-radius:20px;background:none;color:#475467;font-size:13px;font-weight:600;transition:background-color .2s,color .2s}
.tool .ib{color:#d0d4db}
.ib svg{flex:none}
.lb{display:grid;grid-template-columns:minmax(0,0fr);overflow:hidden;transition:grid-template-columns .2s cubic-bezier(.2,.8,.2,1)}
.lb span{min-width:0;white-space:nowrap;padding:0 4px 0 6px}
.ib:focus-visible .lb,.ib[aria-current] .lb,.ib.peek .lb{grid-template-columns:minmax(0,1fr)}
.nav .ib[aria-current]{background:#e8edff;color:#2445c4}
.tool .ib:focus-visible,.tool .ib.peek{background:rgba(255,255,255,.12);color:#fff}
@media (hover:hover){.ib:hover .lb{grid-template-columns:minmax(0,1fr);transition-delay:.12s}
.nav .ib:hover{color:#1f2329}
.tool .ib:hover{background:rgba(255,255,255,.12);color:#fff}
}
@media (hover:none){.tool .lb{grid-template-columns:minmax(0,1fr)}
}
.msg{margin:0;min-height:18px;font-size:12px;color:#5b616e}
@container (max-height:180px){.st{gap:10px}
}
</style>

<div class="st">
  <nav class="bar nav" aria-label="主导航">
    <button type="button" class="ib"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20H4z"/><path d="M10 20v-5h4v5"/></svg><span class="lb" data-clip><span>首页</span></span></button>
    <button type="button" class="ib" aria-current="page"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg><span class="lb" data-clip><span>发现</span></span></button>
    <button type="button" class="ib"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="m12 4 2.4 5 5.3.6-4 3.6 1.1 5.3L12 15.8 7.2 18.5l1.1-5.3-4-3.6 5.3-.6z"/></svg><span class="lb" data-clip><span>收藏</span></span></button>
    <button type="button" class="ib"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg><span class="lb" data-clip><span>消息</span></span></button>
  </nav>
  <div class="bar tool" role="toolbar" aria-label="文档工具">
    <button type="button" class="ib"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9.5h8M8 12.5h5"/></svg><span class="lb" data-clip><span>评论</span></span></button>
    <button type="button" class="ib"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="17" cy="6" r="2.5"/><circle cx="7" cy="12" r="2.5"/><circle cx="17" cy="18" r="2.5"/><path d="m9.2 10.8 5.6-3.4M9.2 13.2l5.6 3.4"/></svg><span class="lb" data-clip><span>分享</span></span></button>
    <button type="button" class="ib"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span class="lb" data-clip><span>历史</span></span></button>
    <button type="button" class="ib"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M7 4h10v16l-5-3.5L7 20z"/></svg><span class="lb" data-clip><span>标记</span></span></button>
  </div>
  <p class="msg" role="status">停留或 Tab 聚焦看名称</p>
</div>

<script type="module">
export default function demo(root) {
  const nav = root.querySelectorAll('.nav .ib'), tools = root.querySelectorAll('.tool .ib'), msg = root.querySelector('.msg');
  nav.forEach((b) => b.addEventListener('click', () => { nav.forEach((x) => x.toggleAttribute('aria-current', x === b)); b.setAttribute('aria-current', 'page'); msg.textContent = `当前：${b.textContent}`; }));
  tools.forEach((b) => b.addEventListener('click', () => { msg.textContent = `已打开${b.textContent}`; }));
  // 打开时演示一次：工具栏第二个按钮伸出名称再收回
  setTimeout(() => root.host.isConnected && tools[1].classList.add('peek'), 500);
  setTimeout(() => root.host.isConnected && tools[1].classList.remove('peek'), 2200);
}
</script>
