<link rel="stylesheet" href="../../_shared/components-core.css">
<style>
.w{width:100%;max-width:340px;display:flex;flex-direction:column;gap:8px}
.lr{display:flex;justify-content:space-between;align-items:baseline}
.b{position:relative;display:flex;flex-direction:column;gap:4px}
.box{display:flex;align-items:center;gap:4px;height:32px;padding:0 4px;overflow:hidden;border:1px solid #c9ced6;border-radius:6px;background:#fff;cursor:text}
.box:hover{border-color:#8a909c}
.box:focus-within{border-color:#3b5bdb;box-shadow:inset 0 0 0 1px #3b5bdb,0 0 0 3px #dfe6ff}
.tags{display:contents}
.tg{flex:none;display:inline-flex;align-items:center;gap:2px;height:24px;padding:0 2px 0 8px;border-radius:4px;background:#eef0f3;font-size:13px;white-space:nowrap}
.tg.arm,.plus.arm{background:#dfe6ff;box-shadow:inset 0 0 0 1px #3b5bdb}
.tg button{display:grid;place-items:center;width:20px;height:20px;padding:0;border:0;border-radius:3px;background:none;color:#5b616e;cursor:pointer}
.tg button:hover{background:#d5d9e0;color:#1f2329}
.plus{flex:none;height:24px;padding:0 6px;border:0;border-radius:4px;background:#eef0f3;color:#5b616e;font-size:13px;cursor:pointer}
.plus:hover,.plus[aria-expanded=true]{background:#d5d9e0;color:#1f2329}
.ti{flex:1;min-width:72px;height:24px;padding:0 4px;border:0;outline:0;background:none}
.ti::placeholder{color:#8a909c}
.more{position:absolute;z-index:1;top:36px;left:0;right:0;display:flex;flex-wrap:wrap;gap:4px;padding:6px;background:#fff;border:1px solid #e3e6eb;border-radius:6px;box-shadow:0 4px 12px rgba(31,35,41,.12)}
.sug{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.sug button{height:24px;padding:0 8px;border:1px dashed #c9ced6;border-radius:999px;background:#fff;font-size:12px;cursor:pointer}
.sug button:hover{border-color:#3b5bdb;color:#3b5bdb}
.sug button:disabled{color:#8a909c;border-color:#e3e6eb;cursor:not-allowed}
</style>

<div class="s"><div class="w"><div class="lr"><label class="lab" for="ti">文章标签</label><span class="help cnt"></span></div><div class="b"><div class="box"><span class="tags"></span><button type="button" class="plus" aria-expanded="false" hidden></button><input id="ti" class="ti" enterkeyhint="done" aria-describedby="th"></div><div class="more" role="group" aria-label="收起的标签" hidden></div><p class="help" id="th" aria-live="polite"></p></div><div class="sug"><span class="help">常用：</span><button type="button">前端</button><button type="button">图标</button><button type="button">字体</button></div></div></div>

<script type="module">
export default function demo(root) {
  const T = ['设计', '无障碍', '表单', '性能', '动效'], MAX = 8, XS = '<svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>';
  const b = root.querySelector('.b'), box = root.querySelector('.box'), tags = root.querySelector('.tags'), plus = root.querySelector('.plus'), more = root.querySelector('.more'), ti = root.querySelector('#ti'), cnt = root.querySelector('.cnt'), th = root.querySelector('#th'); let arm = false;
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const tag = (t, k) => `<span class="tg" data-t="${esc(t)}">${esc(t)}<button type="button" data-k="${k}" aria-label="移除 ${esc(t)}">${XS}</button></span>`;
  const open = (v) => { more.hidden = !v; plus.setAttribute('aria-expanded', String(v)); };
  // 标签放不下时从后往前收进 +N，框高始终一行
  const fit = () => {
    const els = [...tags.children]; els.forEach((x) => { x.hidden = false; }); plus.hidden = true;
    let n = els.length;
    for (let i = els.length - 1; i >= 1 && box.scrollWidth > box.clientWidth; i--) { els[i].hidden = true; n = i; plus.hidden = false; plus.textContent = `+${els.length - i}`; }
    const off = T.slice(n), last = els.at(-1);
    plus.title = off.join('、'); plus.setAttribute('aria-label', `还有 ${off.length} 个标签：${off.join('、')}`);
    more.innerHTML = off.map((t, i) => tag(t, n + i)).join('');
    if (!off.length) open(false);
    last?.classList.toggle('arm', arm && !last.hidden); plus.classList.toggle('arm', arm && !!last?.hidden);
  };
  const draw = (msg) => {
    tags.innerHTML = T.map(tag).join('');
    const full = T.length >= MAX; cnt.textContent = `${T.length} / ${MAX}`; ti.disabled = full; ti.placeholder = full ? '已达上限' : '回车添加';
    th.textContent = msg || (arm ? `再按一次退格删除“${T.at(-1)}”` : full ? `最多 ${MAX} 个标签，先移除一个再添加` : `回车或逗号添加，最多 ${MAX} 个`); th.classList.toggle('warn', !!msg);
    root.querySelectorAll('.sug button').forEach((x) => { x.disabled = full || T.includes(x.textContent); });
    fit();
  };
  const add = (v) => { v = v.trim(); if (!v) return; if (T.includes(v)) return draw(`“${v}”已经添加过了`); if (T.length < MAX) T.push(v); draw(); };
  ti.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); add(ti.value); ti.value = ''; return; }
    if (e.key === 'Backspace' && !ti.value && T.length) { if (arm) { T.pop(); arm = false; } else arm = true; draw(); return; }
    if (arm) { arm = false; draw(); }
  });
  ti.addEventListener('input', (e) => { if (!e.isComposing && /[,，]/.test(ti.value)) { ti.value.split(/[,，]/).forEach(add); ti.value = ''; } });
  b.addEventListener('click', (e) => {
    if (e.target.closest('.plus')) { open(more.hidden); return; }
    const x = e.target.closest('button[data-k]');
    if (x) {
      const k = +x.dataset.k, inMore = more.contains(x); T.splice(k, 1); arm = false; draw();
      const next = (inMore ? more : box).querySelector(`[data-k="${k}"]`);
      if (next && !next.closest('.tg').hidden) { next.focus(); return; }
      if (inMore && !more.hidden) { more.querySelector('button')?.focus(); return; }
    }
    if ((x || e.target.closest('.box')) && !ti.disabled) ti.focus();
  });
  b.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !more.hidden) { open(false); plus.focus(); } });
  root.querySelector('.sug').addEventListener('click', (e) => { const x = e.target.closest('button'); if (x) add(x.textContent); });
  new ResizeObserver(fit).observe(box);
  draw();
}
</script>
