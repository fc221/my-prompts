<link rel="stylesheet" href="../../_shared/components-core.css">
<style>
.w{width:100%;max-width:340px;display:flex;flex-direction:column;gap:8px}
.lr{display:flex;justify-content:space-between;align-items:baseline}
.b{display:flex;flex-direction:column;gap:4px}
.box{display:flex;flex-wrap:wrap;align-items:center;gap:4px;min-height:32px;padding:3px 4px;border:1px solid #c9ced6;border-radius:6px;background:#fff;cursor:text}
.box:hover{border-color:#8a909c}
.box:focus-within{border-color:#3b5bdb;box-shadow:inset 0 0 0 1px #3b5bdb,0 0 0 3px #dfe6ff}
.tags{display:contents}
.tg{display:inline-flex;align-items:center;gap:2px;height:24px;padding:0 2px 0 8px;border-radius:4px;background:#eef0f3;font-size:13px}
.tg.arm{background:#dfe6ff;box-shadow:inset 0 0 0 1px #3b5bdb}
.tg button{display:grid;place-items:center;width:20px;height:20px;padding:0;border:0;border-radius:3px;background:none;color:#5b616e;cursor:pointer}
.tg button:hover{background:#d5d9e0;color:#1f2329}
.ti{flex:1;min-width:80px;height:24px;padding:0 4px;border:0;outline:0;background:none}
.ti::placeholder{color:#8a909c}
.sug{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.sug button{height:24px;padding:0 8px;border:1px dashed #c9ced6;border-radius:999px;background:#fff;font-size:12px;cursor:pointer}
.sug button:hover{border-color:#3b5bdb;color:#3b5bdb}
.sug button:disabled{color:#8a909c;border-color:#e3e6eb;cursor:not-allowed}
</style>

<div class="s"><div class="w"><div class="lr"><label class="lab" for="ti">文章标签</label><span class="help cnt"></span></div><div class="b"><div class="box"><span class="tags"></span><input id="ti" class="ti" enterkeyhint="done" aria-describedby="th"></div><p class="help" id="th" aria-live="polite"></p></div><div class="sug"><span class="help">常用：</span><button type="button">性能</button><button type="button">动效</button><button type="button">前端</button></div></div></div>

<script type="module">
export default function demo(root) {
  const T = ['设计', '无障碍', '表单'], MAX = 5, XS = '<svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>';
  const tags = root.querySelector('.tags'), ti = root.querySelector('#ti'), cnt = root.querySelector('.cnt'), th = root.querySelector('#th'); let arm = false;
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const draw = (msg) => {
    tags.innerHTML = T.map((t, k) => `<span class="tg${arm && k === T.length - 1 ? ' arm' : ''}">${esc(t)}<button type="button" data-k="${k}" aria-label="移除 ${esc(t)}">${XS}</button></span>`).join('');
    const full = T.length >= MAX; cnt.textContent = `${T.length} / ${MAX}`; ti.disabled = full; ti.placeholder = full ? '已达上限' : '输入后按回车';
    th.textContent = msg || (full ? '最多 5 个标签，先移除一个再添加' : '回车或逗号添加，最多 5 个'); th.classList.toggle('warn', !!msg);
    root.querySelectorAll('.sug button').forEach((b) => { b.disabled = full || T.includes(b.textContent); });
  };
  const add = (v) => { v = v.trim(); if (!v) return; if (T.includes(v)) return draw(`“${v}”已经添加过了`); if (T.length < MAX) T.push(v); draw(); };
  ti.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); add(ti.value); ti.value = ''; return; }
    if (e.key === 'Backspace' && !ti.value && T.length) { if (arm) { T.pop(); arm = false; } else arm = true; draw(); return; }
    if (arm) { arm = false; draw(); }
  });
  ti.addEventListener('input', (e) => { if (!e.isComposing && /[,，]/.test(ti.value)) { ti.value.split(/[,，]/).forEach(add); ti.value = ''; } });
  root.querySelector('.box').addEventListener('click', (e) => { const b = e.target.closest('button[data-k]'); if (b) { T.splice(+b.dataset.k, 1); arm = false; draw(); } if (!ti.disabled) ti.focus(); });
  root.querySelector('.sug').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) add(b.textContent); });
  draw();
}
</script>
