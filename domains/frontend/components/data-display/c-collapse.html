<link rel="stylesheet" href="../../_shared/components-overlay.css">
<style>
.acc{width:100%;max-width:480px;max-height:100%;overflow:auto;background:#fff;border:1px solid #e3e6eb;border-radius:10px}
.pn+h4{border-top:1px solid #e3e6eb}
h4 button{width:100%;height:40px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 12px 0 14px;border:0;background:none;font-size:14px;font-weight:600;text-align:left}

.pn.open{grid-template-rows:1fr}

<div class="s"><div class="acc"><h4><button aria-expanded="true" aria-controls="a1" id="h1">如何修改绑定的手机号？<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button></h4><div class="pn" id="a1" role="region" aria-labelledby="h1"><div class="in"><p>进入“设置 › 账号安全”，验证原号码后更换。</p></div></div><h4><button aria-expanded="false" aria-controls="a2" id="h2">发票多久能开好？<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button></h4><div class="pn" id="a2" role="region" aria-labelledby="h2"><div class="in"><p>提交后 1–3 个工作日开具，开好会短信通知。</p></div></div><h4><button aria-expanded="false" aria-controls="a3" id="h3">可以退款吗？<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button></h4><div class="pn" id="a3" role="region" aria-labelledby="h3"><div class="in"><p>购买 7 天内未使用，可申请全额退款。</p></div></div></div></div>

<script type="module">
export default function demo(root) {
  root.querySelectorAll('h4 button').forEach((b) => {
    const pn = root.getElementById(b.getAttribute('aria-controls'));
    const set = (on) => { b.setAttribute('aria-expanded', String(on)); pn.classList.toggle('open', on); pn.inert = !on; };
    set(b.getAttribute('aria-expanded') === 'true');
    b.addEventListener('click', () => set(b.getAttribute('aria-expanded') !== 'true'));
  });
}
</script>
