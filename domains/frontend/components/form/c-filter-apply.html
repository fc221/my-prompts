<link rel="stylesheet" href="../../_shared/components-core.css">
<style>
.s{padding:12px 16px}
.w{display:flex;flex-direction:column;gap:8px;width:100%;max-width:520px;font-size:12px;line-height:18px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.seg{display:inline-flex;padding:2px;background:#e8ebf0;border-radius:7px}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;inset:0;margin:0;opacity:0;cursor:pointer}
.seg span{display:block;padding:0 10px;border-radius:5px;line-height:26px;color:#5b616e;white-space:nowrap}
.seg input:checked+span{background:#fff;color:#1f2329;font-weight:600;box-shadow:0 1px 2px rgba(31,35,41,.12)}
.seg input:focus-visible+span{outline:2px solid #3b5bdb;outline-offset:1px}
.mw{position:relative}
.mr{height:30px;padding:0 10px;font-size:12px}
.mr:disabled,.fs select:disabled{cursor:not-allowed;background:#eef0f3;color:#8a909c}
.pop{position:absolute;z-index:2;right:0;top:calc(100% + 4px);display:flex;flex-direction:column;gap:6px;width:136px;padding:8px 10px;background:#fff;border:1px solid #d5d9e0;border-radius:8px;box-shadow:0 6px 16px rgba(31,35,41,.14)}
.pop label{display:flex;align-items:center;gap:6px;white-space:nowrap;cursor:pointer}
.pop input{margin:0;accent-color:#3b5bdb}
.fs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.fs .sel{display:grid}
.fs .sel>select{width:100%;height:30px;padding:0 20px 0 8px}
.fs .sel::after{margin:0 9px 3px 0}
.rs{display:flex;align-items:center;gap:6px;height:30px}
.tot{flex:1;min-width:0;margin:0;font-size:13px;font-weight:500;white-space:nowrap}
.tot.wait{color:#5b616e;font-size:12px;font-weight:400}
.sp{flex:none;width:14px;height:14px;border:2px solid #c9ced6;border-top-color:#3b5bdb;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}
}
.go{position:relative;height:30px;padding:0 14px;font-size:12px}
.go.dirty::after{content:"";position:absolute;top:-3px;right:-3px;width:8px;height:8px;border:2px solid #f5f6f8;border-radius:50%;background:#b54708}
.tl{display:flex;flex-direction:column;gap:2px;padding-top:6px;border-top:1px solid #e3e6eb}
.ln{display:grid;grid-template-columns:62px minmax(0,1fr) auto;align-items:center;gap:6px;color:#5b616e;font-size:11px;line-height:16px}
.ln.on{color:#1f2329;font-weight:500}
.ch{display:flex;align-items:center;gap:2px;overflow:hidden;height:10px}
.ch i{flex:none;display:block;height:10px;border-radius:2px;width:8px;background:#a8afba}
.ch .q{background:#3b5bdb}
.ch .w{width:20px;background:#f0b35a}
.sm{white-space:nowrap}
.leg{display:flex;gap:10px;font-size:11px;color:#5b616e}
.leg i{display:inline-block;width:8px;height:8px;margin-right:4px;border-radius:2px;background:#a8afba}
.leg .q{background:#3b5bdb}
.leg .w{background:#f0b35a}
@container (max-width:310px){.seg span{padding:0 8px}
.mr{padding:0 8px}
}
@media (prefers-reduced-motion:reduce){.sp{animation-duration:1.6s}
}
</style>

<div class="s"><div class="w"><div class="hd"><div class="seg" role="radiogroup" aria-label="筛选生效方式"><label><input type="radio" name="m" value="auto" checked><span>选完就刷新</span></label><label><input type="radio" name="m" value="manual"><span>点查询</span></label></div><div class="mw"><button type="button" class="btn mr" aria-expanded="false" aria-controls="more"></button><div class="pop" id="more" hidden><label><input type="checkbox" data-f="late" checked>只看超时的</label><label><input type="checkbox" data-f="mine">只看我负责的</label></div></div></div><div class="fs" role="group" aria-label="工单筛选"><span class="sel"><select aria-label="状态" data-f="st"><option value="">全部状态</option><option value="0">待处理</option><option value="1">处理中</option><option value="2">已解决</option></select></span><span class="sel"><select aria-label="渠道" data-f="ch"><option value="">全部渠道</option><option value="0">电话</option><option value="1">在线</option><option value="2">邮件</option></select></span><span class="sel"><select aria-label="等级" data-f="lv"><option value="">全部等级</option><option value="0">紧急</option><option value="1">普通</option></select></span></div><div class="rs"><span class="sp" hidden></span><p class="tot" role="status"></p><button type="button" class="btn pri go" hidden>查询</button></div><div class="tl"><div class="ln" data-m="auto"><span>选完就刷新</span><span class="ch" data-clip aria-hidden="true"></span><span class="sm"></span></div><div class="ln" data-m="manual"><span>点查询</span><span class="ch" data-clip aria-hidden="true"></span><span class="sm"></span></div></div><div class="leg xl" aria-hidden="true"><span><i></i>改一个条件</span><span><i class="q"></i>点查询</span><span><i class="w"></i>等刷新，控件点不了</span></div><p class="help xl">本例每次查询要 1.2 秒，刷新时控件被锁住。连改三个条件试试，再切到“点查询”改一遍。</p></div></div>

<script type="module">
export default function demo(root) {
  const LOAD = 1200, $ = (q) => root.querySelector(q);
  const ROWS = Array.from({ length: 186 }, (_, i) => { const h = Math.imul(i + 1, 2654435761) >>> 8; return { st: h % 3, ch: (h >> 3) % 3, lv: (h >> 6) % 4 ? 1 : 0, late: (h >> 9) % 2 === 0, mine: (h >> 11) % 4 === 0 }; });
  const sels = [...root.querySelectorAll('.fs select')], cks = [...root.querySelectorAll('.pop input')], radios = [...root.querySelectorAll('.seg input')];
  const more = $('.mr'), pop = $('.pop'), tot = $('.tot'), spin = $('.sp'), go = $('.go'), lines = { auto: $('[data-m=auto]'), manual: $('[data-m=manual]') };
  // 每种方式记一串步骤：c 改条件，q 点查询，w 等刷新
  const tally = { auto: { s: 'cwcwcw', ms: 3600 }, manual: { s: 'cccqw', ms: 1200 } };
  let mode = 'auto', fresh = true, dirty = 0;

  const count = () => ROWS.filter((r) => sels.every((x) => !x.value || r[x.dataset.f] === +x.value) && cks.every((x) => !x.checked || r[x.dataset.f])).length;
  const paint = () => {
    for (const m in lines) {
      const t = tally[m], w = t.s.replace(/[^w]/g, '').length, steps = t.s.length - w;
      lines[m].classList.toggle('on', m === mode);
      lines[m].querySelector('.ch').innerHTML = [...t.s].map((c) => `<i class="${c}"></i>`).join('');
      lines[m].querySelector('.sm').textContent = `${steps} 步 · 等 ${w} 次 · ${(t.ms / 1000).toFixed(1)} 秒`;
    }
    const n = cks.filter((x) => x.checked).length;
    more.textContent = n ? `更多筛选（${n}）` : '更多筛选';
    go.hidden = mode === 'auto';
    go.classList.toggle('dirty', dirty > 0);
    go.setAttribute('aria-label', dirty ? `查询，${dirty} 处改动未应用` : '查询');
  };
  const lock = (on) => [...sels, ...cks, more].forEach((x) => { x.disabled = on; });
  const show = () => { tot.className = 'tot'; tot.textContent = `共 ${count()} 条工单` + (dirty ? ` · ${dirty} 处未查询` : ''); };
  const refresh = () => {
    const had = root.activeElement, t = tally[mode];
    t.s += 'w'; t.ms += LOAD; dirty = 0; lock(mode === 'auto'); spin.hidden = false; go.disabled = true;
    tot.className = 'tot wait'; tot.textContent = mode === 'auto' ? '刷新中，下一个条件要等' : '查询中…';
    paint();
    setTimeout(() => {
      if (!root.host.isConnected) return;
      lock(false); spin.hidden = true; go.disabled = false; show();
      if (had && mode === 'auto') had.focus();
    }, LOAD);
  };
  const changed = () => {
    if (fresh) { tally[mode] = { s: '', ms: 0 }; fresh = false; }
    tally[mode].s += 'c';
    if (mode === 'auto') refresh(); else { dirty++; show(); paint(); }
  };
  const closePop = () => { pop.hidden = true; more.setAttribute('aria-expanded', 'false'); };

  [...sels, ...cks].forEach((x) => x.addEventListener('change', changed));
  go.addEventListener('click', () => { if (fresh) { tally.manual = { s: '', ms: 0 }; fresh = false; } tally.manual.s += 'q'; refresh(); });
  radios.forEach((r) => r.addEventListener('change', () => {
    mode = r.value; fresh = true; closePop();
    if (mode === 'auto' && dirty) { dirty = 0; show(); }
    paint();
  }));
  more.addEventListener('click', () => { pop.hidden = !pop.hidden; more.setAttribute('aria-expanded', String(!pop.hidden)); });
  root.addEventListener('click', (e) => { if (!e.target.closest('.mw')) closePop(); });
  root.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !pop.hidden) { closePop(); more.focus(); } });
  show(); paint();
}
</script>
