<link rel="stylesheet" href="../../_shared/components-core.css">
<style>
.dp{display:flex;gap:12px;max-width:100%;padding:8px;background:#fff;border:1px solid #e3e6eb;border-radius:8px;box-shadow:0 4px 12px rgba(31,35,41,.08)}
.side{flex:0 0 100px;min-width:0;display:flex;flex-direction:column;gap:8px}
.trg{display:flex;align-items:center;height:32px;padding:0 6px;border:1px solid #3b5bdb;border-radius:6px;font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.pre{display:flex;flex-direction:column;gap:2px}
.pre button{height:26px;padding:0 8px;border:0;border-radius:4px;background:none;text-align:left;cursor:pointer}
.pre button:hover{background:#f5f6f8}
.pre [aria-pressed=true]{background:#edf1ff;color:#3b5bdb}
.cal{display:flex;flex-direction:column;gap:2px;min-width:0}
.hd{font-size:12px;line-height:20px;font-weight:600;text-align:center}
.g{display:grid;grid-template-columns:repeat(7,minmax(0,26px));font-size:12px;text-align:center}
.g b{font-weight:400;line-height:18px;color:#5b616e}
.g button{height:20px;padding:0;border:0;background:none;cursor:pointer;font-variant-numeric:tabular-nums}
.g button:hover{background:#f5f6f8}
.g .in{background:#edf1ff}
.g .end{background:#3b5bdb;color:#fff;border-radius:4px}
.g .today{font-weight:700;text-decoration:underline;text-underline-offset:2px}
.g button:disabled{color:#c9ced6;cursor:not-allowed;background:none}
</style>

<div class="s"><div class="dp"><div class="side"><div class="trg"><span class="val" aria-live="polite"></span></div><div class="pre" role="group" aria-label="快捷范围"><button type="button" data-p="0">今天</button><button type="button" data-p="6" aria-pressed="true">近 7 天</button><button type="button" data-p="29">近 30 天</button><button type="button" data-p="m">本月</button></div></div><div class="cal"><div class="hd">2026 年 10 月</div><div class="g"></div></div></div></div>

<script type="module">
export default function demo(root) {
  const T = 25, g = root.querySelector('.g'), val = root.querySelector('.val'), pre = [...root.querySelectorAll('.pre button')]; let a = 19, b = 25, pick = 0, label = '';
  const pad = (n) => String(n).padStart(2, '0');
  const draw = () => {
    g.innerHTML = '一二三四五六日'.split('').map((d) => `<b>${d}</b>`).join('') + '<i></i><i></i><i></i>' + Array.from({ length: 31 }, (_, k) => {
      const d = k + 1, cls = (d === a || d === b ? 'end' : d > a && d < b ? 'in' : '') + (d === T ? ' today' : '');
      return `<button type="button" class="${cls}" data-d="${d}" ${d > T ? 'disabled title="不能晚于今天"' : ''} aria-label="10 月 ${d} 日${d === T ? '，今天' : ''}">${d}</button>`;
    }).join('');
    val.textContent = label || `10-${pad(a)} ~ 10-${pad(b)}`;
  };
  pre.forEach((p) => p.addEventListener('click', () => {
    pre.forEach((x) => x.removeAttribute('aria-pressed')); p.setAttribute('aria-pressed', 'true'); pick = 0; b = T;
    const v = p.dataset.p; a = v === 'm' ? 1 : v === '29' ? 0 : T - +v; label = v === '29' ? '09-26 ~ 10-25' : ''; draw();
  }));
  g.addEventListener('click', (e) => {
    const d = +(e.target.closest('button[data-d]') || {}).dataset?.d; if (!d) return;
    pre.forEach((x) => x.removeAttribute('aria-pressed')); label = '';
    if (!pick) { a = b = pick = d; } else { a = Math.min(pick, d); b = Math.max(pick, d); pick = 0; }
    draw(); g.querySelector(`[data-d="${d}"]`).focus();
  });
  draw();
}
</script>
