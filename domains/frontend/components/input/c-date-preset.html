<link rel="stylesheet" href="../../_shared/components-core.css">
<style>
.s{padding:10px 14px;font-size:12px;line-height:18px}
.w{display:flex;gap:16px;width:100%;height:100%;max-width:640px;font-variant-numeric:tabular-nums}
.l{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.seg{flex:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:2px;background:#e8ebf0;border-radius:7px}
.seg button{height:26px;padding:0;border:0;border-radius:5px;background:none;color:#5b616e;white-space:nowrap;cursor:pointer}
.seg button:hover{color:#1f2329}
.seg [aria-pressed=true]{background:#fff;color:#1f2329;font-weight:600;box-shadow:0 1px 2px rgba(31,35,41,.12)}
.rg{flex:none;display:flex;align-items:baseline;gap:6px;margin-top:2px;white-space:nowrap}
.rg b{font-size:14px;font-weight:600}
.rg span{color:#5b616e;font-size:12px}
.ct{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;white-space:nowrap}
.ct em{font-style:normal;color:#12805c}
.ct em.dn{color:#d92d20}
.ct em.fl{color:#5b616e}
.sw{display:inline-flex;align-items:center;gap:6px;color:#5b616e;cursor:pointer}
.sw input{position:absolute;width:1px;height:1px;margin:0;opacity:0}
.sw i{position:relative;flex:none;width:26px;height:16px;border-radius:999px;background:#a8afba;transition:background-color .16s}
.sw i::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:transform .16s}
.sw input:checked+i{background:#3b5bdb}
.sw input:checked+i::after{transform:translateX(10px)}
.sw input:focus-visible+i{outline:2px solid #3b5bdb;outline-offset:2px}
.ch{flex:1;min-height:0;width:100%;display:block}
.ch path{fill:none;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.main{stroke:#3b5bdb;stroke-width:2}
.prev{stroke:#8a909c;stroke-width:1.25;stroke-dasharray:4 3}
.lg{flex:none;display:flex;justify-content:space-between;gap:8px;color:#5b616e;font-size:11px;line-height:14px;white-space:nowrap}
.cal{display:none;flex:none;flex-direction:column;gap:4px;width:196px}
.gh,.gd{display:grid;grid-template-columns:repeat(7,28px);text-align:center}
.gh span{font-size:11px;color:#5b616e}
.gd button{height:26px;padding:0;border:0;background:none;font-size:12px;cursor:pointer}
.gd button:hover{background:#eef0f3}
.gd .in{background:#e6ebff}
.gd .end{background:#3b5bdb;color:#fff;border-radius:5px}
.gd .td{font-weight:700;box-shadow:inset 0 -2px 0 #3b5bdb}
.gd .end.td{box-shadow:inset 0 -2px 0 #fff}
.gd [aria-disabled=true]{color:#a8afba;background:repeating-linear-gradient(135deg,transparent 0 4px,#eef0f3 4px 5px);cursor:not-allowed}
.gd :focus-visible{outline-offset:-2px}
.cal .help{min-height:40px}
@container (min-width:560px){.s{padding:14px 20px}
.cal{display:flex}
.rg b{font-size:15px}
}
@media (prefers-reduced-motion:reduce){.sw i,.sw i::after{transition:none}
}
</style>

<div class="s"><div class="w"><div class="l"><div class="seg" role="group" aria-label="快捷时间范围"></div><div class="rg"><b class="val"></b><span class="note"></span></div><div class="ct"><span class="sum"></span><label class="sw"><input type="checkbox" checked><i></i>和上期对比</label></div><svg class="ch" viewBox="0 0 300 80" preserveAspectRatio="none" role="img"><path class="prev"/><path class="main"/></svg><div class="lg"><span class="a0"></span><span class="b0"></span></div></div><div class="cal"><div class="gh" aria-hidden="true"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div><div class="gd" role="group" aria-label="自定义范围，方向键移动"></div><p class="help" role="status"></p></div></div></div>

<script type="module">
export default function demo(root) {
  // 用天序号算日期：day(0) 是今天 3 月 18 日周三，当前时间 14:30
  const DAY = 864e5, T0 = Date.UTC(2026, 2, 18), MAX = 31, NOW = '14:30';
  const dt = (d) => new Date(T0 + d * DAY), md = (d) => { const x = dt(d); return `${String(x.getUTCMonth() + 1).padStart(2, '0')}-${String(x.getUTCDate()).padStart(2, '0')}`; };
  const $ = (q) => root.querySelector(q);
  const seg = $('.seg'), val = $('.val'), note = $('.note'), sum = $('.sum'), cmp = $('.sw input'), main = $('.main'), prev = $('.prev'), ch = $('.ch'), a0 = $('.a0'), b0 = $('.b0'), gd = $('.gd'), tip = $('.help');
  const PRESET = [
    { t: '今天', a: 0, b: 0, was: -1 },
    { t: '近 7 天', a: -7, b: -1 },
    { t: '近 30 天', a: -30, b: -1 },
    { t: '本月', a: -17, b: 0, was: -45 },
  ];
  let cur = 1, a = -7, b = -1, was = -14, pick = null, focus = -4;
  // 按周起伏、缓慢上升，本期和上期形状相近才看得出差别
  const sale = (d) => 9200 + 30 * d + 1500 * Math.sin((d * 2 * Math.PI) / 7) + ((d * d * 37 + 3000) % 500);
  const line = (vals, n, lo, hi) => vals.map((v, i) => `${i ? 'L' : 'M'}${(i / Math.max(n - 1, 1) * 300).toFixed(1)} ${(72 - (v - lo) / (hi - lo || 1) * 64).toFixed(1)}`).join('');

  const draw = () => {
    const today = a === 0 && b === 0, len = b - a + 1, has = b === 0;
    val.textContent = today ? `${md(0)} 截至 ${NOW}` : `${md(a)} ~ ${md(b)}`;
    note.textContent = today ? '含今天，还没走完' : `共 ${len} 天，${has ? '含今天' : '不含今天'}`;
    // 今天按小时画：x 轴是整天，本期停在当前时刻，上期走完全天
    const cv = today ? Array.from({ length: 15 }, (_, i) => 340 + 170 * Math.sin((i - 8) / 2.6) + i * 6) : Array.from({ length: len }, (_, i) => sale(a + i));
    const pv = today ? Array.from({ length: 24 }, (_, i) => 320 + 170 * Math.sin((i - 8) / 2.6) + ((i * 53) % 40)) : Array.from({ length: len }, (_, i) => sale(was + i));
    const n = today ? 24 : len, all = cmp.checked ? [...cv, ...pv] : cv, lo = Math.min(...all), hi = Math.max(...all);
    main.setAttribute('d', line(cv, n, lo, hi));
    prev.setAttribute('d', cmp.checked ? line(pv, n, lo, hi) : '');
    const c = cv.slice(0, today ? 15 : len).reduce((s, v) => s + v, 0), p = pv.slice(0, today ? 15 : len).reduce((s, v) => s + v, 0), d = (c / p - 1) * 100;
    sum.innerHTML = `销售额 ¥${(c / 1e4).toFixed(1)} 万` + (!cmp.checked ? '' : Math.abs(d) < .05 ? ' <em class="fl">持平</em>' : ` <em class="${d < 0 ? 'dn' : ''}">${d < 0 ? '▼' : '▲'}${Math.abs(d).toFixed(1)}%</em>`);
    a0.textContent = '实线 本期';
    b0.textContent = cmp.checked ? (today ? '虚线 昨天全天，涨跌比到同一时刻' : `虚线 上期 ${md(was)} ~ ${md(was + len - 1)}`) : '';
    ch.setAttribute('aria-label', `销售走势，${val.textContent}${cmp.checked ? '，灰色虚线是上期' : ''}`);
    seg.querySelectorAll('button').forEach((x, i) => x.setAttribute('aria-pressed', String(i === cur)));
    drawCal();
  };
  // 日历连续排 6 周，到今天所在那周结束
  const first = -37;
  const off = (d) => d > 0 || (pick !== null && Math.abs(d - pick) > MAX - 1);
  const drawCal = () => {
    gd.innerHTML = Array.from({ length: 42 }, (_, i) => {
      const d = first + i, x = dt(d), dd = x.getUTCDate(), inR = pick === null && d > a && d < b, end = pick === null ? d === a || d === b : d === pick;
      return `<button type="button" data-d="${d}" tabindex="${d === focus ? 0 : -1}" class="${inR ? 'in ' : ''}${end ? 'end ' : ''}${d === 0 ? 'td' : ''}" ${off(d) ? `aria-disabled="true" title="${d > 0 ? '不能晚于今天' : `最多选 ${MAX} 天`}"` : ''} aria-label="${x.getUTCMonth() + 1} 月 ${dd} 日${d === 0 ? '，今天' : ''}${off(d) ? `，不可选，${d > 0 ? '不能晚于今天' : `最多选 ${MAX} 天`}` : ''}">${dd === 1 ? `${x.getUTCMonth() + 1}月` : dd}</button>`;
    }).join('');
    tip.textContent = pick === null ? `自定义最多选 ${MAX} 天，超出的日期变灰` : `已选开始 ${md(pick)}，再选结束日期`;
  };
  const moveTo = (d) => { focus = Math.min(first + 41, Math.max(first, d)); drawCal(); gd.querySelector(`[data-d="${focus}"]`).focus(); };

  seg.innerHTML = PRESET.map((p, i) => `<button type="button" data-i="${i}">${p.t}</button>`).join('');
  seg.addEventListener('click', (e) => {
    const x = e.target.closest('button'); if (!x) return;
    const p = PRESET[+x.dataset.i]; cur = +x.dataset.i; a = p.a; b = p.b; pick = null; was = p.was ?? a - (b - a + 1); focus = b; draw();
  });
  cmp.addEventListener('change', draw);
  gd.addEventListener('click', (e) => {
    const x = e.target.closest('button'); if (!x || x.getAttribute('aria-disabled')) return;
    const d = +x.dataset.d; focus = d;
    if (pick === null) { pick = d; drawCal(); } else { a = Math.min(pick, d); b = Math.max(pick, d); pick = null; cur = -1; was = a - (b - a + 1); draw(); }
    gd.querySelector(`[data-d="${d}"]`).focus();
  });
  gd.addEventListener('keydown', (e) => {
    const m = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7 }[e.key]; if (!m) return;
    e.preventDefault(); moveTo(+e.target.dataset.d + m);
  });
  draw();
}
</script>
