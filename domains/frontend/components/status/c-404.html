<link rel="stylesheet" href="../../_shared/components-overlay.css">
<style>
.s{padding:12px}
.pg{position:relative;width:100%;max-width:560px;height:100%;padding:12px;background:#fff;border:1px solid #e3e6eb;border-radius:10px;display:grid;place-items:center}
.seg{position:absolute;top:8px;right:8px}
.ct{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.code{font-size:13px;font-weight:600;color:#5b616e;font-variant-numeric:tabular-nums;letter-spacing:.06em}
h4{font-size:18px}
.ac{display:flex;gap:8px;margin-top:10px}
</style>

<div class="s"><div class="pg"><div class="seg" role="group" aria-label="切换示例状态"><button aria-pressed="true">404</button><button aria-pressed="false">500</button></div><div class="ct"></div></div></div>

<script type="module">
export default function demo(root) {
  const V = [
    ['404', '页面不存在', '链接可能已失效，或地址输入有误。', '返回首页', '上一页'],
    ['500', '服务暂时出了点问题', '我们已记录这个错误（编号 a81c02），请稍后重试。', '重试', '返回首页'],
  ];
  const ct = root.querySelector('.ct'), seg = [...root.querySelectorAll('.seg button')];
  const show = (k) => { seg.forEach((b, j) => b.setAttribute('aria-pressed', String(j === k))); const v = V[k]; ct.innerHTML = `<p class="code">${v[0]}</p><h4>${v[1]}</h4><p class="muted">${v[2]}</p><div class="ac"><button class="b p">${v[3]}</button><button class="b">${v[4]}</button></div>`; };
  seg.forEach((b, k) => b.addEventListener('click', () => show(k)));
  show(0);
}
</script>
