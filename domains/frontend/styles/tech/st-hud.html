<script type="module">
export default function demo(root) {
  const clk = root.querySelector('.clk'), v = root.querySelector('.v'), target = 128.6;
  const pad = (n) => String(n).padStart(2, '0');
  let t = new Date(2026, 9, 29, 14, 32, 8);
  const tick = () => {
    if (!root.host.isConnected) return clearInterval(id);
    t = new Date(t.getTime() + 1000); clk.textContent = `${pad(t.getHours())}:${pad(t.getMinutes())}:${pad(t.getSeconds())}`;
  };
  const id = setInterval(tick, 1000);
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  // 600ms 滚动计数到目标值
  const t0 = performance.now();
  const run = (now) => {
    if (!root.host.isConnected) return;
    const k = Math.min(1, (now - t0) / 600);
    v.textContent = (target * (1 - (1 - k) ** 3)).toFixed(1);
    if (k < 1) requestAnimationFrame(run);
  };
  requestAnimationFrame(run);
}
</script>
