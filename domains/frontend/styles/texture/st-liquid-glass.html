.tab svg{width:24px;height:24px}

}
@media (prefers-reduced-transparency:reduce){.g,.lq .chip,.lq .bar{background:rgba(28,26,44,.88);-webkit-backdrop-filter:none;backdrop-filter:none}
.lq .lens,.lens{background:rgba(255,255,255,.16);-webkit-backdrop-filter:none;backdrop-filter:none}

<script type="module">
export default function demo(root) {
  const s = root.querySelector('.s'), bar = root.querySelector('.bar'), lens = root.querySelector('.lens'), chip = root.querySelector('.chip');
  const tabs = [...root.querySelectorAll('.tab')], live = root.querySelector('[role=status]');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  // 位移滤镜写进 backdrop-filter 只有 Chromium 内核稳定生效；用 userAgentData 判断内核，其他浏览器保持普通毛玻璃
  const refract = 'userAgentData' in navigator;
  if (refract) s.classList.add('lq');
  // 位移图：R、G 写边缘法线方向的偏移（朝里取样），只在边缘 bezel 内有值，中间 128 不偏移
  const map = (w, h, bezel) => {
    w = Math.max(2, Math.round(w)); h = Math.max(2, Math.round(h));
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const ctx = c.getContext('2d'), img = ctx.createImageData(w, h), d = img.data, r = h / 2, hx = w / 2 - r, hy = h / 2 - r;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const px = x + 0.5 - w / 2, py = y + 0.5 - h / 2, qx = Math.abs(px) - hx, qy = Math.abs(py) - hy;
      const out = Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) + Math.min(Math.max(qx, qy), 0) - r, depth = -out;
      let nx = 0, ny = 0;
      if (qx > 0 && qy > 0) { const l = Math.hypot(qx, qy) || 1; nx = qx / l; ny = qy / l; } else if (qx > qy) nx = 1; else ny = 1;
      nx *= Math.sign(px) || 1; ny *= Math.sign(py) || 1;
      const m = depth <= 0 ? 1 : depth < bezel ? (1 - depth / bezel) ** 2 : 0, i = (y * w + x) * 4;
      d[i] = 128 - nx * m * 127; d[i + 1] = 128 - ny * m * 127; d[i + 2] = 128; d[i + 3] = 255;
    }
    ctx.putImageData(img, 0, 0); return c.toDataURL();
  };
  const paintMap = (id, el, bezel) => {
    const fe = root.getElementById(id).querySelector('feImage'), w = el.offsetWidth, h = el.offsetHeight;
    fe.setAttribute('width', w); fe.setAttribute('height', h); fe.setAttribute('href', map(w, h, bezel));
  };
  let cell = 0, x = 0, vx = 0, tx = 0, sc = 1, vs = 0, ts = 1, sel = 0, raf = 0, last = 0, drag = null;
  const apply = () => {
    const st = reduce ? 0 : Math.min(Math.abs(vx) / 1200, 0.3);
    lens.style.setProperty('--x', x.toFixed(2) + 'px');
    lens.style.setProperty('--sx', (sc * (1 + st)).toFixed(3));
    lens.style.setProperty('--sy', (sc * (1 - st / 3)).toFixed(3));
  };
  // 弹簧：位置刚度 320、阻尼 22；鼓起的缩放刚度 420、阻尼 24
  const tick = (t) => {
    raf = 0; if (!root.host.isConnected) return;
    let dt = Math.min(0.032, (t - (last || t)) / 1000); last = t;
    for (let k = 0; k < 4; k++) { const h = dt / 4; vx += (320 * (tx - x) - 22 * vx) * h; x += vx * h; vs += (420 * (ts - sc) - 24 * vs) * h; sc += vs * h; }
    apply();
    if (Math.abs(tx - x) < 0.3 && Math.abs(vx) < 3 && Math.abs(ts - sc) < 0.002 && Math.abs(vs) < 0.02) { x = tx; vx = 0; sc = ts; vs = 0; last = 0; apply(); return; }
    raf = requestAnimationFrame(tick);
  };
  const go = () => { if (reduce) { x = tx; sc = 1; vx = 0; apply(); return; } if (!raf) { last = 0; raf = requestAnimationFrame(tick); } };
  const select = (i, speak = true) => {
    sel = Math.max(0, Math.min(tabs.length - 1, i)); tx = sel * cell; go();
    tabs.forEach((b, k) => { b.setAttribute('aria-selected', String(k === sel)); b.tabIndex = k === sel ? 0 : -1; });
    if (speak) live.textContent = '已切到' + tabs[sel].textContent;
  };
  const layout = () => {
    const inner = bar.clientWidth - 2 * parseFloat(getComputedStyle(bar).paddingLeft);
    cell = inner / tabs.length; lens.style.setProperty('--w', cell + 'px'); x = tx = sel * cell; vx = 0; apply();
    if (refract) { paintMap('lg-chip', chip, 9); paintMap('lg-bar', bar, 14); paintMap('lg-lens', lens, 12); }
  };
  const posOf = (cx) => { const r = bar.getBoundingClientRect(), pad = (r.width - cell * tabs.length) / 2; return Math.max(0, Math.min(cell * (tabs.length - 1), cx - r.left - pad - cell / 2)); };
  const press = (cx) => { ts = reduce ? 1 : 1.12; tx = posOf(cx); go(); };
  const release = () => { ts = 1; select(Math.round(tx / cell)); };
  bar.addEventListener('pointerdown', (e) => { if (e.button) return; drag = e.pointerId; try { bar.setPointerCapture(e.pointerId); } catch {} press(e.clientX); });
  bar.addEventListener('pointermove', (e) => { if (drag !== e.pointerId) return; tx = posOf(e.clientX); go(); });
  const up = (e) => { if (drag !== e.pointerId) return; drag = null; release(); };
  bar.addEventListener('pointerup', up); bar.addEventListener('pointercancel', up);
  // 键盘：Enter / 空格经 click 选中；方向键、Home / End 切换并移焦
  tabs.forEach((b, i) => b.addEventListener('click', (e) => { if (e.detail === 0) select(i); }));
  bar.addEventListener('keydown', (e) => {
    const n = { ArrowLeft: sel - 1, ArrowRight: sel + 1, Home: 0, End: tabs.length - 1 }[e.key];
    if (n === undefined) return; e.preventDefault(); select(n); tabs[sel].focus();
  });
  new ResizeObserver(layout).observe(bar);
  layout();
  // 自动演示一次：按住首页，滑到相册再松手
  if (!reduce) {
    const t0 = performance.now(), from = bar.getBoundingClientRect(), pad = (from.width - cell * tabs.length) / 2;
    const at = (i) => bar.getBoundingClientRect().left + pad + cell * (i + 0.5);
    setTimeout(() => {
      if (!root.host.isConnected || drag !== null) return; press(at(0));
      const step = (t) => { if (!root.host.isConnected || drag !== null) return; const p = Math.min(1, (t - t0 - 300) / 600); tx = posOf(at(0) + (at(2) - at(0)) * p); go(); if (p < 1) requestAnimationFrame(step); else setTimeout(() => { if (drag === null) release(); }, 120); };
      requestAnimationFrame(step);
    }, 300);
  } else select(2, false);
}
</script>
