<link rel="stylesheet" href="../../../frontend/_shared/diagram.css">

<script type="module">
import { draw, code } from '../../../frontend/_shared/diagram.ts';
export default function demo(root) {
  draw(root, code([{ t: 'qpdf：只改结构，不重新渲染', text: `
# 合并：合同正文全部 + 附件第 1-3 页
qpdf --empty --pages 合同.pdf 附件.pdf 1-3 -- out.pdf
# 拆分：每 10 页一份
qpdf in.pdf --split-pages=10 part-%d.pdf
# 重排：3、1、2，再接第 4 页到最后一页（z）
qpdf in.pdf --pages in.pdf 3,1,2,4-z -- out.pdf
# 双面扫描交错：反面倒序扫的用 z-1 倒回来
qpdf --collate --empty --pages 正面.pdf 反面.pdf z-1 -- out.pdf
# 旋转第 2、4 页
qpdf in.pdf out.pdf --rotate=+90:2,4
` }]), { title: '合并、拆分与重排' });
}
</script>
