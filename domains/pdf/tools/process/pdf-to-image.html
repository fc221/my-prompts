import { draw, code } from '../../../frontend/_shared/diagram.ts';
export default function demo(root) {
  draw(root, code([{ t: 'pdftoppm', text: `

pdftoppm -png -f 1 -l 1 -scale-to 640 in.pdf thumb

` }]), { title: '转图片 · 一定要设像素上限' });
