<link rel="stylesheet" href="../../../frontend/_shared/diagram.css">
<style>
.dg.mock{background:radial-gradient(120% 90% at 30% 20%,#3a3a3c,#1d1d1f 70%)}
.mock .dg-row{justify-content:center}
.mock .dg-col{flex:none}
.m-set{display:flex;gap:18px}
.m-pg{position:relative;width:210px;height:297px;overflow:hidden;background:#fffdf8;color:#2b2618;font-family:system-ui,"PingFang SC",sans-serif;box-shadow:0 18px 40px -12px rgba(0,0,0,.7)}
.m-pg p,.m-pg h1,.m-pg h3{margin:0}
.m-band{position:relative;height:88px;padding:13px 16px 0;display:flex;gap:10px;background:linear-gradient(100deg,#fff4cf,#ffe594 55%,#fff1c2)}
.m-band.m-sm{height:26px;padding:0 16px;align-items:center;justify-content:space-between;font:700 6px/1 system-ui,"PingFang SC",sans-serif}
.m-band.m-sm span{color:#8a7d55;font-weight:600;font-size:4.6px;letter-spacing:.12em}
.m-ph{position:relative;flex:none;width:42px;height:52px;overflow:hidden;border:1.5px solid #fff;border-radius:2px;background:radial-gradient(80% 70% at 50% 35%,#f4efe4,#d9cfbd)}
.m-ph::before{content:"";position:absolute;left:6%;right:6%;bottom:-5px;height:38%;border-radius:48% 48% 0 0/64% 64% 0 0;background:#3c4a63}
.m-ph::after{content:"";position:absolute;left:calc(50% - 3.5px);top:46%;width:7px;height:10px;background:#d8a684}
.m-ph i{position:absolute;z-index:1;left:calc(50% - 9.5px);top:13%;width:19px;height:23px;border-radius:50%;background:radial-gradient(circle 8.5px at 50% 66%,#efc3a1 97%,transparent 100%),#2a1d17}
.m-ph s{position:absolute;left:calc(50% - 11.5px);top:17%;width:23px;height:28px;border-radius:11px 11px 5px 5px;background:#2a1d17}
.m-id{flex:1;min-width:0}
.m-id h1{font:900 18px/1.12 "Songti SC","Noto Serif CJK SC","Source Han Serif SC",serif;letter-spacing:.04em}
.m-id p{margin-top:6px!important;font:800 7.5px/1 system-ui,"PingFang SC",sans-serif}
.m-id p small{margin-left:4px;color:#8a7d55;font:600 4.6px/1 system-ui,sans-serif;letter-spacing:.16em}
.m-id span{display:block;margin-top:5px;color:#5c5338;font:500 4.5px/1.6 system-ui,"PingFang SC",sans-serif}
.m-qr{flex:none;align-self:flex-start;width:32px;text-align:center;color:#8a7d55;font:600 3.8px/1.3 system-ui,"PingFang SC",sans-serif}
.m-qr svg{display:block;width:32px;height:32px;margin-bottom:2px;padding:2px;background:#fff;border-radius:1.5px}
.m-body{padding:11px 16px 0;display:grid;gap:9px}
.m-sec h3{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:3px;border-bottom:.6px solid #e2d4a6;font:800 7.5px/1 "Songti SC","Noto Serif CJK SC",serif}
.m-sec h3 small{color:#bfae7a;font:600 4.8px/1 system-ui,sans-serif;letter-spacing:.2em}
.m-row{display:grid;grid-template-columns:50px minmax(0,1fr);gap:8px;margin:5px 0 0}
.m-row dt{font:700 4.8px/1.5 system-ui,sans-serif}
.m-row dt small{display:block;color:#7a7155;font:500 4.4px/1.5 system-ui,"PingFang SC",sans-serif}
.m-row dd{margin:0;color:#5c5338;font:500 4.5px/1.6 system-ui,"PingFang SC",sans-serif}
.m-row dd b{display:block;color:#2b2618;font:800 5.6px/1.4 system-ui,"PingFang SC",sans-serif}
.m-foot{position:absolute;left:16px;right:16px;bottom:9px;display:flex;justify-content:space-between;color:#b0a57f;font:600 4.2px/1 system-ui,"PingFang SC",sans-serif;letter-spacing:.08em}
</style>

<div class="dg mock"></div>

<script type="module">
import { draw } from '../../../frontend/_shared/diagram.ts';
// 二维码只是示意：三个定位角加一组固定的模块
const qr = (() => {
  const n = 21, on = [];
  const finder = (x, y) => { for (let i = 0; i < 7; i++) for (let j = 0; j < 7; j++) { const e = i === 0 || i === 6 || j === 0 || j === 6, c = i > 1 && i < 5 && j > 1 && j < 5; if (e || c) on.push([x + i, y + j]); } };
  finder(0, 0); finder(14, 0); finder(0, 14);
  for (let x = 0; x < n; x++) for (let y = 0; y < n; y++) {
    const inF = (x < 8 && y < 8) || (x > 12 && y < 8) || (x < 8 && y > 12);
    if (!inF && ((x * 7 + y * 13 + x * y) % 5 < 2)) on.push([x, y]);
  }
  return `<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges"><path fill="#2b2618" d="${on.map(([x, y]) => `M${x} ${y}h1v1h-1z`).join('')}"/></svg>`;
})();
const sec = (zh, en, rows) => `<section class="m-sec"><h3>${zh}<small>${en}</small></h3>${rows.map(([t, u, b, d]) => `<dl class="m-row"><dt>${t}<small>${u}</small></dt><dd><b>${b}</b>${d}</dd></dl>`).join('')}</section>`;
const p1 = `<div class="m-pg">
  <header class="m-band"><div class="m-ph"><s></s><i></i></div>
    <div class="m-id"><h1>市场营销<br>管培生</h1><p>MyPrompts<small>2026 届硕士</small></p>
      <span>136 5208 7731 · 上海<br>linxm@hdbs.edu.cn</span></div>
    <div class="m-qr">${qr}扫码看作品集</div></header>
  <div class="m-body">
    ${sec('教育背景', 'EDUCATION', [
      ['2024.09 – 2026.06', '华东商学院', '市场营销 硕士 · GPA 3.8 / 4.0', '核心课程：消费者行为、品牌管理、营销数据分析'],
      ['2020.09 – 2024.06', '南岭大学', '广告学 本科 · 专业前 5%', '连续三年一等奖学金，交换学期在新加坡'],
    ])}
    ${sec('实习经历', 'INTERNSHIP', [
      ['2025.07 – 2025.12', '鲜丰果业', '品牌市场实习生', '策划 3 场门店会员日，带动会员复购率提升 9%<br>维护品牌社交平台账号，半年涨粉 1.8 万'],
      ['2024.12 – 2025.03', '启航教育', '用户增长实习生', '搭建投放数据周报，渠道获客成本下降 14%<br>参与暑期课包定价测试，整理 600 份问卷'],
    ])}
    ${sec('校园经历', 'CAMPUS', [
      ['2024.10 – 2025.09', '研究生会', '外联部 部长', '对接 12 家企业赞助，带 8 人团队办校园招聘月'],
    ])}
  </div><p class="m-foot"><span>MyPrompts · 市场营销管理培训生</span><span>1 / 2</span></p></div>`;
const p2 = `<div class="m-pg">
  <header class="m-band m-sm">MyPrompts · 个人简历<span>RESUME · 2 / 2</span></header>
  <div class="m-body">
    ${sec('项目经历', 'PROJECTS', [
      ['2025.03 – 2025.06', '课程项目', '本地茶饮品牌焕新方案', '访谈 30 位常客，提出“城市限定杯”方案<br>方案被品牌方采用，首月限定杯售出 2.4 万杯'],
      ['2023.06 – 2023.09', '大学生竞赛', '乡村农产品直播策划', '团队 5 人，三场直播销售额 6.2 万元，获省赛银奖'],
    ])}
    ${sec('获奖与证书', 'AWARDS', [
      ['2023.11', '省级', '大学生营销策划大赛 银奖', '团队队长，负责调研与路演'],
      ['2022 – 2024', '证书', '英语 IELTS 7.5 · 普通话二级甲等', '初级数据分析师证书'],
    ])}
    ${sec('技能与语言', 'SKILLS', [
      ['工具', '熟练', 'Excel 数据透视 · SQL 基础 · Canva', '能独立完成投放数据清洗和周报'],
      ['语言', '英语', '全英文课程与汇报', '可用英文撰写营销方案'],
    ])}
    ${sec('自我评价', 'PROFILE', [
      ['关键词', '', '数据驱动 · 有执行力', '喜欢在门店和用户中间找答案，做过的每个活动都会回看数据复盘。'],
    ])}
  </div><p class="m-foot"><span>MyPrompts · 市场营销管理培训生</span><span>2 / 2</span></p></div>`;
export default function demo(root) {
  draw(root, `<div class="m-set">${p1}${p2}</div>`, { center: true, min: 0.25 });
}
</script>
