<link rel="stylesheet" href="../../../frontend/_shared/diagram.css">
<style>
.dg.mock{background:radial-gradient(120% 90% at 30% 20%,#3a3a3c,#1d1d1f 70%)}
.mock .dg-row{justify-content:center}
.mock .dg-col{flex:none}
.m-set{display:flex;gap:18px;align-items:flex-end}
.m-pg{position:relative;overflow:hidden;color:#1d1d1b;font-family:system-ui,"PingFang SC",sans-serif;box-shadow:0 18px 40px -12px rgba(0,0,0,.7)}
.m-v{width:210px;height:297px}
.m-photo{position:absolute;inset:0;background:linear-gradient(#aebcc6,#d9d6cc 46%,#f1d7ad 58%,#6b5a48 60%,#3b322a)}
.m-photo::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 30% at 70% 58%,rgba(255,236,200,.55),transparent 70%)}
.m-hill{position:absolute;left:0;right:0;height:30px;background:#93a0a6;opacity:.55;clip-path:polygon(0 70%,18% 30%,34% 55%,52% 10%,70% 48%,86% 22%,100% 50%,100% 100%,0 100%)}
.m-mach{position:absolute;width:150px;height:100px}
.m-mach *{fill:#2a2c2f}
.m-mach .m-st{fill:none;stroke:#2a2c2f;stroke-linecap:round}
.m-mach .m-win{fill:#c7d2d6;opacity:.75}
.m-mach .m-whl{fill:#4a4d50}
.m-yel{position:absolute;inset:0;background:#f2b705}
.m-big{position:absolute;margin:0;color:rgba(255,255,255,.26);font:900 96px/1 system-ui,sans-serif;letter-spacing:-.03em;white-space:nowrap}
.m-logo{position:absolute;left:16px;top:14px;margin:0;display:flex;align-items:center;gap:4px;font:800 7px/1 system-ui,"PingFang SC",sans-serif;letter-spacing:.1em}
.m-logo i{width:9px;height:9px;background:#1d1d1b;clip-path:polygon(0 100%,50% 0,100% 100%,70% 100%,50% 50%,30% 100%)}
.m-txt{position:absolute;left:16px}
.m-txt h1{margin:0;font:900 32px/1.02 system-ui,"PingFang SC",sans-serif;letter-spacing:.02em}
.m-txt h2{margin:8px 0 5px;font:800 8.5px/1.3 system-ui,"PingFang SC",sans-serif}
.m-txt p{margin:0;width:112px;font:500 5.4px/1.7 system-ui,"PingFang SC",sans-serif;color:#3d3520}
.m-data{position:absolute;left:16px;bottom:14px;display:flex;gap:12px}
.m-data div{width:52px;padding-top:5px;border-top:.8px solid #1d1d1b}
.m-data svg{display:block;width:12px;height:12px;margin-bottom:3px;fill:none;stroke:#1d1d1b;stroke-width:1.3;stroke-linejoin:round;stroke-linecap:round}
.m-data b{display:block;font:900 12px/1 system-ui,sans-serif}
.m-data b small{font:800 5.5px/1 system-ui,"PingFang SC",sans-serif;margin-left:1px}
.m-data span{display:block;margin-top:2px;font:500 5px/1.3 system-ui,"PingFang SC",sans-serif;color:#3d3520}
/* 竖版：斜线从左边 30% 到右边 56%，照片在上、黄色在下 */
.m-v .m-yel{clip-path:polygon(0 30%,100% 56%,100% 100%,0 100%)}
.m-v .m-photo{background:linear-gradient(#aebcc6,#d9d6cc 30%,#f1d7ad 39%,#6b5a48 41%,#3b322a)}
.m-v .m-photo::after{background:radial-gradient(60% 22% at 60% 40%,rgba(255,236,200,.55),transparent 70%)}
.m-v .m-hill{top:92px}
.m-v .m-mach{left:56px;top:30px}
.m-v .m-big{left:-6px;top:126px}
.m-v .m-logo{color:#fff}
.m-v .m-logo i{background:#fff}
.m-v .m-txt{top:124px}
/* 内页跨页：左页照片 + 斜边黄带，右页斜边黄色页头 + 参数 + 斜切细节图 */
.m-sp{display:flex;box-shadow:0 18px 40px -12px rgba(0,0,0,.7)}
.m-sp .m-pg{width:210px;height:297px;box-shadow:none}
.m-sp .m-pg:first-child::after{content:"";position:absolute;z-index:5;inset:0 0 0 auto;width:14px;background:linear-gradient(90deg,transparent,rgba(0,0,0,.18))}
.m-sp .m-pg+.m-pg::before{content:"";position:absolute;z-index:5;inset:0 auto 0 0;width:14px;background:linear-gradient(90deg,rgba(0,0,0,.1),transparent)}
.m-l .m-photo{background:linear-gradient(#a9b8c3,#d6d4cb 40%,#f0d6ab 52%,#6b5a48 54%,#3b322a)}
.m-l .m-photo::after{background:radial-gradient(60% 22% at 45% 52%,rgba(255,236,200,.55),transparent 70%)}
.m-l .m-hill{top:131px}
.m-l .m-mach{left:20px;top:52px;width:190px;height:127px}
.m-l .m-yel{clip-path:polygon(0 62%,100% 88%,100% 100%,0 100%)}
.m-l .m-logo{color:#fff}
.m-l .m-logo i{background:#fff}
.m-no{position:absolute;left:16px;top:228px;margin:0;font:900 38px/1 system-ui,sans-serif;letter-spacing:-.03em}
.m-ch{position:absolute;left:64px;top:236px;margin:0;font:900 16px/1.1 system-ui,"PingFang SC",sans-serif}
.m-ch small{display:block;margin-top:4px;color:#3d3520;font:700 4.8px/1 system-ui,sans-serif;letter-spacing:.16em}
.m-r{background:#f7f5ef}
.m-r .m-yel{clip-path:polygon(0 0,100% 0,100% 40%,0 14%)}
.m-r .m-big{left:-4px;top:-12px;font-size:72px}
.m-hd{position:absolute;right:16px;top:16px;margin:0;text-align:right}
.m-hd small{display:block;font:700 5px/1 system-ui,"PingFang SC",sans-serif;letter-spacing:.14em}
.m-hd b{display:block;margin-top:5px;font:900 26px/1 system-ui,sans-serif;letter-spacing:-.02em}
.m-hd span{display:block;margin-top:4px;font:800 9px/1 system-ui,"PingFang SC",sans-serif}
.m-intro{position:absolute;left:16px;top:94px;width:84px;margin:0;color:#3d3520;font:500 5px/1.75 system-ui,"PingFang SC",sans-serif}
.m-spec{position:absolute;left:16px;right:16px;top:134px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 10px}
.m-spec div{padding:5px 0;border-top:.6px solid #1d1d1b}
.m-spec b{display:block;font:900 12px/1 system-ui,sans-serif}
.m-spec b small{margin-left:1px;font:700 5.5px/1 system-ui,sans-serif}
.m-spec span{display:block;margin-top:3px;color:#5b5240;font:500 4.8px/1.3 system-ui,"PingFang SC",sans-serif}
.m-det{position:absolute;left:12px;right:20px;top:200px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.m-det figure{margin:0}
.m-det i{display:block;position:relative;height:54px;overflow:hidden;transform:skewX(16deg);transform-origin:top}
.m-det i::before{content:"";position:absolute;inset:-4px -20px;transform:skewX(-16deg)}
.m-d1::before{background:radial-gradient(40% 45% at 55% 45%,#c7d2d6,#5b666c 60%,#2a2c2f)}
.m-d2::before{background:repeating-linear-gradient(90deg,#2a2c2f 0 7px,#4a4d50 7px 9px),#2a2c2f}
.m-d3::before{background:radial-gradient(50% 40% at 40% 70%,#6b5a48,transparent 70%),linear-gradient(160deg,#3a3d41 40%,#7a6a55 41%,#a08a6c)}
.m-det figcaption{margin:5px 0 0 15px;white-space:nowrap;font:700 5px/1.4 system-ui,"PingFang SC",sans-serif}
.m-det figcaption small{display:block;color:#5b5240;font-weight:500}
.m-pno{position:absolute;bottom:12px;margin:0;font:700 4.8px/1 system-ui,sans-serif;letter-spacing:.14em}
</style>

<div class="dg mock"></div>

<script type="module">
import { draw } from '../../../frontend/_shared/diagram.ts';
const mach = `<svg class="m-mach" viewBox="0 0 150 100">
  <rect x="50" y="78" width="88" height="16" rx="8"/><circle class="m-whl" cx="60" cy="86" r="4"/><circle class="m-whl" cx="76" cy="86" r="4"/><circle class="m-whl" cx="92" cy="86" r="4"/><circle class="m-whl" cx="108" cy="86" r="4"/><circle class="m-whl" cx="126" cy="86" r="4"/>
  <rect x="56" y="70" width="80" height="8"/><rect x="84" y="50" width="56" height="22" rx="3"/>
  <rect x="58" y="38" width="26" height="34" rx="3"/><rect class="m-win" x="62" y="42" width="18" height="14" rx="1.5"/>
  <path class="m-st" stroke-width="9" d="M70 58L42 16"/><path class="m-st" stroke-width="6" d="M42 16L18 54"/>
  <path class="m-st" stroke-width="2" style="stroke:#6d7276" d="M64 66L46 30"/>
  <path d="M8 52H26L23 68Q13 72 6 64Z"/></svg>`;
const icon = {
  year: '<svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.6"/><path d="M6 3.4V6l1.8 1.2"/></svg>',
  globe: '<svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.6"/><path d="M1.4 6h9.2M6 1.4c-2.4 2.6-2.4 6.6 0 9.2M6 1.4c2.4 2.6 2.4 6.6 0 9.2"/></svg>',
  plant: '<svg viewBox="0 0 12 12"><path d="M1 10.6V5.2l3 2V5.2l3 2V2h3.6v8.6Z"/><path d="M8.2 4.2h1.2"/></svg>',
};
const page = (cls) => `<div class="m-pg ${cls}">
  <div class="m-photo"></div><i class="m-hill"></i>${mach}
  <i class="m-yel"></i><p class="m-big">BUILD</p>
  <p class="m-logo"><i></i>MyPrompts</p>
  <div class="m-txt"><h1>重器<br>致远</h1><h2>2026 产品与合作手册</h2>
    <p>从矿山到港口，MyPrompts 的挖掘、起重和桩工设备已在 46 个国家开工。这本手册介绍主力机型、服务网络和代理合作方式。</p></div>
  <div class="m-data">
    <div>${icon.year}<b>38<small>年</small></b><span>专注工程机械</span></div>
    <div>${icon.globe}<b>120<small>+</small></b><span>海外服务网点</span></div>
    <div>${icon.plant}<b>2.6<small>万台</small></b><span>年产能</span></div>
  </div></div>`;
const spread = `<div class="m-sp">
  <div class="m-pg m-l"><div class="m-photo"></div><i class="m-hill"></i>${mach}<i class="m-yel"></i>
    <p class="m-logo"><i></i>MyPrompts</p>
    <p class="m-no">01</p><p class="m-ch">主力机型<small>MAIN MODELS · 6 款</small></p>
    <p class="m-pno" style="right:16px">06</p></div>
  <div class="m-pg m-r"><i class="m-yel"></i><p class="m-big">360</p>
    <p class="m-hd"><small>01 主力机型 · 36 吨级</small><b>HY-360</b><span>液压挖掘机</span></p>
    <p class="m-intro">为矿山和大型土方设计，加强型动臂和斗杆，连续作业 10 小时油耗低于同级 8%。</p>
    <div class="m-spec">
      <div><b>36<small>t</small></b><span>整机重量</span></div><div><b>1.8<small>m³</small></b><span>标准斗容</span></div><div><b>212<small>kW</small></b><span>额定功率</span></div>
      <div><b>7.4<small>m</small></b><span>最大挖掘深度</span></div><div><b>10<small>rpm</small></b><span>回转速度</span></div><div><b>600<small>L</small></b><span>燃油箱</span></div>
    </div>
    <div class="m-det">
      <figure><i class="m-d1"></i><figcaption>驾驶室<small>全景玻璃 · 72dB</small></figcaption></figure>
      <figure><i class="m-d2"></i><figcaption>履带底盘<small>600mm 宽履带板</small></figcaption></figure>
      <figure><i class="m-d3"></i><figcaption>岩石斗<small>耐磨板厚 20mm</small></figcaption></figure>
    </div>
    <p class="m-pno" style="left:16px">07 · MyPrompts 2026 产品与合作手册</p></div>
</div>`;
export default function demo(root) {
  draw(root, `<div class="m-set">${page('m-v')}${spread}</div>`, { center: true, min: 0.25 });
}
</script>
