<link rel="stylesheet" href="../../../frontend/_shared/diagram.css">

<script type="module">
import { draw, code } from '../../../frontend/_shared/diagram.ts';
export default function demo(root) {
  draw(root, code([
    { t: 'N+1：41 次查询', text: `
SELECT … FROM orders
  LIMIT 20;
-- 循环 20 次，每单两条
SELECT … FROM order_item
  WHERE order_id = ?;
SELECT … FROM member
  WHERE id = ?;
-- 1 + 20 × 2 = 41 次
` },
    { t: '批量：2 次查询', text: `
-- 多对一：JOIN 一次取回
SELECT … FROM orders
  JOIN member ON …
  LIMIT 20;
-- 一对多：IN 批量查
SELECT … FROM order_item
  WHERE order_id IN (…);
-- 20 条和 50 条都是 2 次
` },
  ]), { title: '列表页 20 个订单 · 查询次数和条数无关' });
}
</script>
